<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garantie — FDS Institut DZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Montserrat:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --orange: #FF7900;
    --blue: #00304E;
    --gray-50: #F7F8FA;
    --gray-200: #E2E3E5;
    --gray-500: #6B7280;
    --black: #111;
  }
  body { font-family: 'Montserrat', sans-serif; background: var(--gray-50); color: var(--black); }

  .section {
    background: var(--gray-50);
    padding: 72px 24px;
  }

  .card {
    max-width: 760px;
    margin: 0 auto;
    background: #fff;
    border: 1.5px solid var(--gray-200);
    border-radius: 20px;
    padding: 40px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    text-align: center;
  }

  @media (min-width: 640px) {
    .card {
      flex-direction: row;
      text-align: left;
    }
  }

  .icon-wrap {
    flex-shrink: 0;
    width: 64px;
    height: 64px;
    color: var(--orange);
  }

  .icon-wrap svg {
    width: 100%;
    height: 100%;
  }

  .card-body { flex: 1; }

  .card-title {
    font-family: 'Sora', sans-serif;
    font-size: clamp(1.125rem, 3vw, 1.5rem);
    font-weight: 700;
    color: var(--blue);
    letter-spacing: -0.02em;
    margin-bottom: 10px;
    line-height: 1.25;
  }

  .card-desc {
    font-size: 0.9375rem;
    color: var(--gray-500);
    line-height: 1.65;
  }

  .cta-wrap { flex-shrink: 0; }

  .btn-cta {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.9375rem;
    font-weight: 600;
    background: var(--orange);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px 28px;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
  }

  .btn-cta:hover { opacity: 0.88; }

  @media (max-width: 639px) {
    .card { padding: 32px 28px; }
  }
</style>
</head>
<body>
  <section class="section">
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <div class="card-body">
        <h3 class="card-title">Garantie 14 jours, satisfait ou remboursé.</h3>
        <p class="card-desc">Essayez sans risque. Si ce n'est pas pour vous, on vous rembourse &mdash; sans question.</p>
      </div>
      <div class="cta-wrap">
        <button class="btn-cta" onclick="alert('Modal')">Réserver</button>
      </div>
    </div>
  </section>
</body>
</html>
