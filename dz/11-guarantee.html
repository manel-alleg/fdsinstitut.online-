<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDS Institut — Garantie</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&family=Montserrat:wght@700;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{background:#030712;color:#fff;font-family:'Poppins',sans-serif}
h3{font-family:'Montserrat',sans-serif;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
:root{--orange:#f97316;--ink:#15233c;--mint:#86efac}
::selection{background:var(--orange);color:var(--ink)}

section{padding:0 1.5rem 3rem}
@media(min-width:1024px){section{padding:0 3rem 3rem}}
.card{max-width:60rem;margin:0 auto;border-radius:2rem;border:1px solid rgba(134,239,172,.4);background:rgba(134,239,172,.1);padding:2rem 2.5rem;display:flex;flex-direction:column;align-items:center;gap:1.5rem;backdrop-filter:blur(24px);text-align:center}
@media(min-width:640px){.card{flex-direction:row;text-align:left}}
.icon{font-size:3.75rem;flex-shrink:0}
.body{flex:1}
h3{font-size:clamp(1.25rem,4vw,1.875rem);font-weight:900;color:#fff;margin-bottom:.5rem}
.desc{color:rgba(255,255,255,.6);line-height:1.6}
.cta{flex-shrink:0;border-radius:9999px;background:var(--orange);color:var(--ink);font-family:'Montserrat',sans-serif;font-weight:900;padding:.75rem 1.5rem;font-size:.875rem;transition:transform .2s}
.cta:hover{transform:scale(1.05)}
</style>
</head>
<body>
<section>
  <div class="card">
    <div class="icon">🛡️</div>
    <div class="body">
      <h3>Garantie 14 jours, satisfait ou remboursé.</h3>
      <p class="desc">Essayez sans risque. Si ce n'est pas pour vous, on vous rembourse — sans question.</p>
    </div>
    <a href="#enroll" class="cta">Réserver →</a>
  </div>
</section>
</body>
</html>
