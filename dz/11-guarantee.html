<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Garantie — FDS Institut</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Montserrat:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#FF7900;
  --blue:#00304E;
  --black:#111;
  --gray-50:#F7F8FA;
  --gray-200:#E2E3E5;
  --gray-500:#6B7280;
}
body{font-family:'Montserrat',sans-serif;color:var(--black);background:transparent;line-height:1.6}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .55s ease,transform .55s ease}
.reveal.in{opacity:1;transform:none}
.reveal-d1{transition-delay:.1s}

section{
  background:linear-gradient(135deg,#FF7900 0%,#FF9100 100%);
  padding:4rem 1.5rem;
}
.guarantee-inner{
  max-width:1000px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:2.5rem;
  flex-wrap:wrap;
}

.guarantee-left{
  display:flex;
  align-items:center;
  gap:1.75rem;
  flex:1;
  min-width:260px;
}

.shield-wrap{
  flex-shrink:0;
  width:64px;height:64px;
  display:flex;align-items:center;justify-content:center;
}

.guarantee-text{}
.guarantee-title{
  font-family:'Sora',sans-serif;
  font-weight:800;
  font-size:clamp(1.2rem,2.5vw,1.6rem);
  color:#fff;
  line-height:1.2;
  margin-bottom:.5rem;
}
.guarantee-sub{
  font-family:'Montserrat',sans-serif;
  font-size:.92rem;
  color:rgba(255,255,255,.88);
  line-height:1.65;
  max-width:440px;
}

.btn-white{
  display:inline-flex;
  align-items:center;
  gap:.5rem;
  background:#fff;
  color:var(--orange);
  border:2px solid #fff;
  border-radius:12px;
  font-family:'Montserrat',sans-serif;
  font-weight:700;
  font-size:.95rem;
  padding:.85rem 1.75rem;
  cursor:pointer;
  text-decoration:none;
  transition:background .2s,color .2s,transform .2s,box-shadow .2s;
  white-space:nowrap;
  flex-shrink:0;
}
.btn-white:hover{
  background:rgba(255,255,255,.92);
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(0,0,0,.15);
}

@media(max-width:700px){
  .guarantee-inner{flex-direction:column;align-items:flex-start;gap:2rem}
  .btn-white{width:100%;justify-content:center}
  section{padding:3.5rem 1.25rem}
}
</style>
</head>
<body>
<section>
  <div class="guarantee-inner">
    <div class="guarantee-left reveal">
      <div class="shield-wrap">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M32 6L10 16V32C10 44.15 19.73 55.5 32 58C44.27 55.5 54 44.15 54 32V16L32 6Z" fill="rgba(255,255,255,0.2)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
          <polyline points="22,32 29,39 42,26" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="guarantee-text">
        <div class="guarantee-title">Satisfait ou remboursé — 14 jours</div>
        <p class="guarantee-sub">Essayez FDS Institut sans risque. Si vous n'êtes pas entièrement satisfait dans les 14 jours suivant votre inscription, nous vous remboursons intégralement. Sans question posée.</p>
      </div>
    </div>
    <button class="btn-white reveal reveal-d1" onclick="openModal()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Réserver mon cours d'essai
    </button>
  </div>
</section>

<script>
function openModal(){
  if(window.parent&&window.parent.openModal){
    window.parent.openModal();
  } else {
    var hero=document.getElementById('hero');
    if(hero){hero.scrollIntoView({behavior:'smooth'});}
  }
}

const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');obs.unobserve(e.target)}})},{threshold:.1});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
</script>
</body>
</html>
