<style>
.fds-block{margin:0!important;padding:0!important;display:block;box-sizing:border-box}
.fds-block *{box-sizing:border-box}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet"/>
<style>
:root{--orange:#FF7900;--blue:#00304E;--gray-50:#F7F8FA;--gray-200:#E2E3E5;--gray-500:#6B7280}
.fds-block{font-family:'Montserrat',sans-serif;overflow-x:hidden}
.hueber-partner{background:var(--gray-50);border-top:2px solid var(--gray-200);border-bottom:2px solid var(--gray-200);padding:2.5rem 1.5rem}
.hueber-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:2.5rem;flex-wrap:wrap;justify-content:space-between}
.hueber-left{display:flex;align-items:center;gap:1.5rem;flex:1;min-width:260px}
.hueber-logo-wrap{background:#c8102e;border-radius:12px;padding:.6rem .9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hueber-logo{height:32px;width:auto;display:block;filter:brightness(0) invert(1)}
.hueber-divider{width:1.5px;height:36px;background:var(--gray-200);flex-shrink:0}
.hueber-eyebrow{font-family:'Nunito',sans-serif;font-weight:800;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);display:block;margin-bottom:.2rem}
.hueber-headline{font-family:'Sora',sans-serif;font-weight:700;font-size:1rem;color:var(--blue);line-height:1.25;margin-bottom:.2rem}
.hueber-sub{font-size:.8rem;color:var(--gray-500);line-height:1.5}
.hueber-badge{display:inline-flex;align-items:center;gap:.4rem;font-family:'Nunito',sans-serif;font-weight:800;font-size:.75rem;background:#fff;border:1.5px solid var(--gray-200);border-radius:999px;padding:.45rem 1rem;color:var(--blue);white-space:nowrap;flex-shrink:0}
@media(max-width:600px){
  .hueber-inner{flex-direction:column;align-items:flex-start;gap:1.25rem}
  .hueber-badge{width:100%;justify-content:center}
}
</style>
<div class="fds-block">
<section class="hueber-partner">
  <div class="hueber-inner">
    <div class="hueber-left">
      <div class="hueber-logo-wrap">
        <img src="https://assets.zyrosite.com/V9huRYqxhZWbrM0f/images-PWItKH9DVHHhbq3K.png" alt="Hueber Verlag" class="hueber-logo"/>
      </div>
      <div class="hueber-divider"></div>
      <div>
        <span class="hueber-eyebrow">Curriculum Partner</span>
        <div class="hueber-headline">Hueber Verlag — Official Textbooks</div>
        <div class="hueber-sub">All FDS Institut courses use Hueber's certified German learning materials — the standard trusted by language schools worldwide.</div>
      </div>
    </div>
    <div class="hueber-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      Official Curriculum Partner
    </div>
  </div>
</section>
</div>
