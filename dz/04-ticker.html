<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ticker — FDS Institut</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Montserrat:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#FF7900;
  --orange-2:#FF9100;
  --blue:#00304E;
  --black:#111;
  --gray-50:#F7F8FA;
  --gray-200:#E2E3E5;
  --gray-500:#6B7280;
  --moodle:#F27F22;
}
@keyframes marquee{to{transform:translateX(-50%)}}
body{font-family:'Montserrat',sans-serif;color:var(--black);background:#fff;line-height:1.6;overflow-x:hidden}

#ticker{
  background:#fff;
  border-top:1.5px solid var(--gray-200);
  border-bottom:1.5px solid var(--gray-200);
  padding:.7rem 0;
  overflow:hidden;
}
.ticker-track{
  display:flex;
  width:max-content;
  animation:marquee 38s linear infinite;
  will-change:transform;
}
.ticker-item{
  display:inline-flex;
  align-items:center;
  gap:.65rem;
  padding:0 1.5rem;
  font-family:'Nunito',sans-serif;
  font-weight:700;
  font-size:.82rem;
  color:var(--blue);
  white-space:nowrap;
  letter-spacing:.03em;
}
.ticker-diamond{
  flex-shrink:0;
  display:flex;
  align-items:center;
}
</style>
</head>
<body>
<div id="ticker" aria-hidden="true">
  <div class="ticker-track">
    <!-- first set -->
    <span class="ticker-item">A1 → C2</span>
    <span class="ticker-diamond"><svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="#FF7900"/></svg></span>
    <span class="ticker-item">Cours en direct</span>
    <span class="ticker-diamond"><svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="#FF7900"/></svg></span>
    <span class="ticker-item">Profs certifiés</span>
    <span class="ticker-diamond"><svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="#FF7900"/></svg></span>
    <span class="ticker-item">Standards européens</span>
    <span class="ticker-diamond"><svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="#FF7900"/></svg></span>
    <span class="ticker-item">Paiement DA</span>
    <span class="ticker-diamond"><svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="#FF7900"/></svg></span>
    <span class="ticker-item">Replays à vie</span>
    <span class="ticker-diamond"><svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="#FF7900"/></svg></span>
    <span class="ticker-item">Petits groupes</span>
    <span class="ticker-diamond"><svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="#FF7900"/></svg></span>
    <span class="ticker-item">Remboursé 14 jours</span>
    <span class="ticker-diamond"><svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="#FF7900"/></svg></span>
    <span class="ticker-item">FDS Institut</span>
    <span class="ticker-diamond"><svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="#FF7900"/></svg></span>
    <!-- duplicate set for seamless loop -->
    <span class="ticker-item">A1 → C2</span>
    <span class="ticker-diamond"><svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="#FF7900"/></svg></span>
    <span class="ticker-item">Cours en direct</span>
    <span class="ticker-diamond"><svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="#FF7900"/></svg></span>
    <span class="ticker-item">Profs certifiés</span>
    <span class="ticker-diamond"><svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="#FF7900"/></svg></span>
    <span class="ticker-item">Standards européens</span>
    <span class="ticker-diamond"><svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="#FF7900"/></svg></span>
    <span class="ticker-item">Paiement DA</span>
    <span class="ticker-diamond"><svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="#FF7900"/></svg></span>
    <span class="ticker-item">Replays à vie</span>
    <span class="ticker-diamond"><svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="#FF7900"/></svg></span>
    <span class="ticker-item">Petits groupes</span>
    <span class="ticker-diamond"><svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="#FF7900"/></svg></span>
    <span class="ticker-item">Remboursé 14 jours</span>
    <span class="ticker-diamond"><svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="#FF7900"/></svg></span>
    <span class="ticker-item">FDS Institut</span>
    <span class="ticker-diamond"><svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="#FF7900"/></svg></span>
  </div>
</div>
</body>
</html>
