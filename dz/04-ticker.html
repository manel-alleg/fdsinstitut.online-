<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticker — FDS Institut DZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Montserrat:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --orange: #FF7900;
    --blue: #00304E;
    --gray-50: #F7F8FA;
    --gray-200: #E2E3E5;
    --gray-500: #6B7280;
    --black: #111;
  }
  body { font-family: 'Montserrat', sans-serif; background: #fff; overflow: hidden; }

  .ticker-wrap {
    border-top: 1px solid var(--gray-200);
    border-bottom: 1px solid var(--gray-200);
    background: var(--gray-50);
    padding: 14px 0;
    overflow: hidden;
    white-space: nowrap;
  }

  .marquee {
    display: inline-flex;
    align-items: center;
    animation: marquee 44s linear infinite;
    will-change: transform;
  }

  @keyframes marquee {
    from { transform: translateX(0); }
    to { transform: translateX(-33.333%); }
  }

  .ticker-item {
    font-family: 'Sora', sans-serif;
    font-weight: 600;
    font-size: clamp(0.875rem, 2vw, 1rem);
    color: var(--blue);
    letter-spacing: -0.01em;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
  }

  .diamond {
    color: var(--orange);
    margin: 0 20px;
    font-size: 0.6rem;
  }
</style>
</head>
<body>
  <div class="ticker-wrap">
    <div class="marquee" id="marquee"></div>
  </div>
  <script>
    const words = ['A1 &rarr; C2', 'Cours en direct', 'Profs certifi&eacute;s', 'Standards europ&eacute;ens', 'Paiement DA', 'Replays &agrave; vie', 'Petits groupes', 'Rembours&eacute; 14 jours'];
    const all = [...words, ...words, ...words];
    const m = document.getElementById('marquee');
    all.forEach(w => {
      const span = document.createElement('span');
      span.className = 'ticker-item';
      span.innerHTML = w + '<span class="diamond">&#9670;</span>';
      m.appendChild(span);
    });
  </script>
</body>
</html>
