<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FDS Institut — Ticker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#FF7900;
  --orange-2:#FF9100;
  --blue:#00304E;
  --black:#111;
  --gray-50:#F7F8FA;
  --gray-100:#F0F1F3;
  --gray-200:#E2E3E5;
  --gray-500:#6B7280;
  --moodle:#F27F22;
}
body{font-family:'Montserrat',sans-serif;color:var(--black);background:#fff;margin:0;padding:0;overflow-x:hidden}
@keyframes marquee{to{transform:translateX(-50%)}}
#ticker{
  background:#fff;
  border-top:1.5px solid var(--gray-200);
  border-bottom:1.5px solid var(--gray-200);
  padding:.75rem 0;
  overflow:hidden;
  width:100%;
}
.ticker-track{
  display:flex;
  align-items:center;
  width:max-content;
  animation:marquee 28s linear infinite;
  gap:0;
}
.ticker-track:hover{animation-play-state:paused}
.ticker-item{
  display:flex;
  align-items:center;
  gap:.75rem;
  padding:0 1.25rem;
  font-family:'Nunito',sans-serif;
  font-weight:700;
  font-size:.82rem;
  color:var(--blue);
  white-space:nowrap;
  letter-spacing:.02em;
}
.ticker-sep{
  flex-shrink:0;
  display:flex;
  align-items:center;
}
</style>
</head>
<body>
<div id="ticker">
  <div class="ticker-track" id="ticker-track">
    <!-- filled by JS -->
  </div>
</div>
<script>
var items = [
  "Apprenez l'allemand",
  "A1 → C2",
  "En direct",
  "FDS Institut",
  "+3 200 étudiants",
  "TestDaF",
  "Goethe-Zertifikat",
  "Professeurs certifiés",
  "Remboursé 14j",
  "Depuis Alger"
];

var diamond = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="0.5" width="6.364" height="6.364" rx=".5" transform="rotate(45 5 .5)" fill="#FF7900"/></svg>';

function buildTrack() {
  var track = document.getElementById('ticker-track');
  var html = '';
  // doubled for seamless loop
  for (var r = 0; r < 2; r++) {
    for (var i = 0; i < items.length; i++) {
      html += '<span class="ticker-item">' + items[i] + '</span>';
      html += '<span class="ticker-sep">' + diamond + '</span>';
    }
  }
  track.innerHTML = html;
}

buildTrack();
</script>
</body>
</html>
