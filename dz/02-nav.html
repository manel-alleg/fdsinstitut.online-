<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigation — FDS Institut DZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Montserrat:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --orange: #FF7900;
    --blue: #00304E;
    --gray-50: #F7F8FA;
    --gray-200: #E2E3E5;
    --gray-500: #6B7280;
    --black: #111;
  }
  body { font-family: 'Montserrat', sans-serif; background: #fff; }

  .nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #fff;
    border-bottom: 1px solid var(--gray-200);
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .nav-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .nav-logo {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 1.375rem;
    color: var(--blue);
    text-decoration: none;
    letter-spacing: -0.03em;
  }

  .nav-logo .dot { color: var(--orange); }

  .nav-badge {
    font-family: 'Nunito', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--gray-500);
    background: var(--gray-50);
    border: 1px solid var(--gray-200);
    border-radius: 999px;
    padding: 4px 12px;
    white-space: nowrap;
  }

  .nav-right {
    display: flex;
    align-items: center;
  }

  .nav-switcher {
    font-family: 'Nunito', sans-serif;
    font-size: 0.8125rem;
    font-weight: 700;
    color: var(--blue);
    text-decoration: none;
    border: 1.5px solid var(--blue);
    border-radius: 8px;
    padding: 7px 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.18s, color 0.18s;
  }

  .nav-switcher:hover {
    background: var(--blue);
    color: #fff;
  }

  @media (max-width: 540px) {
    .nav-badge { display: none; }
  }
</style>
</head>
<body>
  <nav class="nav">
    <div class="nav-left">
      <a href="/" class="nav-logo">FDS<span class="dot">.</span></a>
      <span class="nav-badge">100% en ligne &nbsp;&middot;&nbsp; A1&ndash;C2 &nbsp;&middot;&nbsp; Algérie</span>
    </div>
    <div class="nav-right">
      <a href="../global/index.html" class="nav-switcher">International &rarr;</a>
    </div>
  </nav>
</body>
</html>
