<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Navigation — FDS Institut</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Montserrat:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#FF7900;
  --orange-2:#FF9100;
  --blue:#00304E;
  --black:#111;
  --gray-50:#F7F8FA;
  --gray-100:#F0F1F3;
  --gray-200:#E2E3E5;
  --gray-500:#6B7280;
  --moodle:#F27F22;
}
body{font-family:'Montserrat',sans-serif;color:var(--black);background:#fff;line-height:1.6;overflow-x:hidden}
/* ── NAV ── */
#nav{
  position:sticky;
  top:0;
  z-index:100;
  background:#fff;
  border-bottom:1.5px solid var(--gray-200);
  height:64px;
  display:flex;
  align-items:center;
}
.nav-inner{
  max-width:1200px;
  margin:0 auto;
  padding:0 1.5rem;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1rem;
}
.nav-logo{
  display:flex;
  align-items:center;
  gap:.6rem;
  text-decoration:none;
}
.logo-text{
  font-family:'Sora',sans-serif;
  font-weight:800;
  font-size:1.5rem;
  color:var(--blue);
  line-height:1;
}
.logo-dot{color:var(--orange)}
.nav-badge{
  font-family:'Nunito',sans-serif;
  font-weight:700;
  font-size:.65rem;
  background:var(--gray-100);
  color:var(--blue);
  padding:.2rem .5rem;
  border-radius:6px;
  letter-spacing:.06em;
}
.nav-actions{
  display:flex;
  align-items:center;
  gap:.75rem;
}
.nav-intl{
  font-family:'Montserrat',sans-serif;
  font-weight:600;
  font-size:.85rem;
  color:var(--blue);
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:.3rem;
  border:1.5px solid var(--gray-200);
  padding:.45rem 1rem;
  border-radius:8px;
  transition:all .2s;
}
.nav-intl:hover{border-color:var(--orange);color:var(--orange)}
.btn{
  display:inline-flex;
  align-items:center;
  gap:.5rem;
  font-family:'Montserrat',sans-serif;
  font-weight:600;
  font-size:.85rem;
  padding:.5rem 1.1rem;
  border-radius:8px;
  border:2px solid transparent;
  cursor:pointer;
  transition:all .2s;
  text-decoration:none;
  white-space:nowrap;
}
.btn-orange{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn-orange:hover{background:var(--orange-2);border-color:var(--orange-2);transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,121,0,.35)}
@media(max-width:1023px){.nav-intl{display:none}}
</style>
</head>
<body>
<nav id="nav">
  <div class="nav-inner">
    <a href="#" class="nav-logo">
      <span class="logo-text">FDS<span class="logo-dot">.</span></span>
      <span class="nav-badge">ALGÉRIE · A1–C2</span>
    </a>
    <div class="nav-actions">
      <a href="../global/index.html" class="nav-intl">
        International
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
      <button class="btn btn-orange" onclick="scrollToHero()">Réserver ma place</button>
    </div>
  </div>
</nav>
<script>
function scrollToHero(){
  const hero=document.getElementById('hero');
  if(hero){hero.scrollIntoView({behavior:'smooth'});}
  else{window.location.href='#hero';}
}
</script>
</body>
</html>
