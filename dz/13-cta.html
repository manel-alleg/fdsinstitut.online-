<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Rejoignez FDS Institut</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Montserrat:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#FF7900;
  --orange-2:#FF9100;
  --blue:#00304E;
  --black:#111;
  --gray-50:#F7F8FA;
  --gray-200:#E2E3E5;
  --gray-500:#6B7280;
}
body{font-family:'Montserrat',sans-serif;color:var(--black);background:var(--blue);line-height:1.6}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .65s ease,transform .65s ease}
.reveal.in{opacity:1;transform:none}
.reveal-d1{transition-delay:.12s}
.reveal-d2{transition-delay:.22s}
section{
  background:var(--blue);
  padding:5.5rem 1.5rem;
  text-align:center;
}
.cta-inner{max-width:680px;margin:0 auto}
.eyebrow{font-family:'Nunito',sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:1rem;display:block}
.cta-title{
  font-family:'Sora',sans-serif;
  font-weight:800;
  font-size:clamp(2rem,5vw,3.25rem);
  color:#fff;
  line-height:1.1;
  margin-bottom:1.1rem;
}
.cta-title .accent{color:var(--orange)}
.cta-sub{
  font-size:1rem;
  color:rgba(255,255,255,.7);
  margin-bottom:2.25rem;
  line-height:1.72;
  max-width:500px;
  margin-left:auto;
  margin-right:auto;
}
.cta-btns{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:1rem;
  flex-wrap:wrap;
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:.5rem;
  font-family:'Montserrat',sans-serif;
  font-weight:600;
  font-size:.95rem;
  padding:.85rem 1.85rem;
  border-radius:12px;
  border:2px solid transparent;
  cursor:pointer;
  text-decoration:none;
  transition:all .2s;
  white-space:nowrap;
}
.btn-orange{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn-orange:hover{background:var(--orange-2);border-color:var(--orange-2);transform:translateY(-2px);box-shadow:0 8px 28px rgba(255,121,0,.4)}
.btn-outline-white{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.btn-outline-white:hover{background:rgba(255,255,255,.08);border-color:#fff}

.trust-line{
  margin-top:2rem;
  font-family:'Nunito',sans-serif;
  font-weight:600;
  font-size:.78rem;
  color:rgba(255,255,255,.4);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.6rem;
}
.trust-sep{opacity:.3}

@media(max-width:580px){
  section{padding:4rem 1.25rem}
  .cta-btns{flex-direction:column}
  .cta-btns .btn{width:100%;justify-content:center}
}
</style>
</head>
<body>
<section>
  <div class="cta-inner">
    <span class="eyebrow reveal">Passez à l'action</span>
    <h2 class="cta-title reveal reveal-d1">Prêt à parler <span class="accent">allemand</span>&nbsp;?</h2>
    <p class="cta-sub reveal reveal-d1">Rejoignez +3 200 étudiants algériens qui apprennent l'allemand en direct. Premier cours d'essai gratuit, sans engagement.</p>
    <div class="cta-btns reveal reveal-d2">
      <button class="btn btn-orange" onclick="openModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Réserver ma place
      </button>
      <a href="https://elearning.fdsinstitut.com" target="_blank" rel="noopener noreferrer" class="btn btn-outline-white">
        Voir la plateforme
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
    </div>
    <div class="trust-line reveal reveal-d2">
      <span>Remboursé 14 jours</span>
      <span class="trust-sep">·</span>
      <span>Sans engagement</span>
      <span class="trust-sep">·</span>
      <span>CCP · Edahabia · BaridiMob</span>
    </div>
  </div>
</section>

<script>
function openModal(){
  if(window.parent&&window.parent.openModal){
    window.parent.openModal();
  } else {
    var hero=document.getElementById('hero');
    if(hero){hero.scrollIntoView({behavior:'smooth'});}
  }
}

const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');obs.unobserve(e.target)}})},{threshold:.1});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
</script>
</body>
</html>
