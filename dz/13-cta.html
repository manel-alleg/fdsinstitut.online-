<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FDS Institut — Commencez maintenant</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#FF7900;
  --blue:#00304E;
  --black:#111;
  --gray-50:#F7F8FA;
  --gray-200:#E2E3E5;
  --gray-500:#6B7280;
}
body{font-family:'Montserrat',sans-serif;color:var(--black);background:var(--blue);line-height:1.6;overflow-x:hidden}
h1,h2,h3{font-family:'Sora',sans-serif;line-height:1.12}

section{padding:6rem 1.5rem;background:var(--blue);text-align:center}
.inner{max-width:720px;margin:0 auto}

.eyebrow{font-family:'Nunito',sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:1.25rem;display:flex;align-items:center;justify-content:center;gap:.6rem}
.eyebrow-line{width:28px;height:2px;background:var(--orange);border-radius:2px}

h2{font-size:clamp(2rem,5vw,3.25rem);font-weight:800;color:#fff;margin-bottom:1rem;line-height:1.1}
h2 .accent{color:var(--orange)}

.sub{font-size:1.05rem;color:rgba(255,255,255,.7);margin-bottom:2.5rem;line-height:1.65}
.sub strong{color:#fff;font-weight:600}

/* Buttons */
.btn-row{display:flex;align-items:center;justify-content:center;gap:1rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.5rem;font-family:'Montserrat',sans-serif;font-weight:700;font-size:1rem;padding:.9rem 2rem;border-radius:12px;border:2.5px solid transparent;cursor:pointer;transition:all .22s;text-decoration:none;white-space:nowrap}
.btn-orange{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn-orange:hover{background:#FF9100;border-color:#FF9100;transform:translateY(-2px);box-shadow:0 8px 28px rgba(255,121,0,.4)}
.btn-outline-white{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.btn-outline-white:hover{background:rgba(255,255,255,.08);border-color:#fff}

/* Trust row */
.trust-row{display:flex;align-items:center;justify-content:center;gap:2rem;margin-top:2.5rem;flex-wrap:wrap}
.trust-item{display:flex;align-items:center;gap:.45rem;font-family:'Nunito',sans-serif;font-weight:600;font-size:.8rem;color:rgba(255,255,255,.55)}
.trust-item svg{flex-shrink:0;opacity:.65}
</style>
</head>
<body>
<section>
  <div class="inner">

    <div class="eyebrow">
      <span class="eyebrow-line"></span>
      Rejoignez la communauté
      <span class="eyebrow-line"></span>
    </div>

    <h2>Prêt à parler <span class="accent">allemand ?</span></h2>

    <p class="sub">
      <strong>+3 200 étudiants algériens</strong> ont déjà commencé leur parcours avec FDS Institut.<br/>
      Votre première séance peut avoir lieu cette semaine.
    </p>

    <div class="btn-row">
      <button class="btn btn-orange" onclick="window.parent && window.parent.scrollToHero ? window.parent.scrollToHero() : window.scrollTo({top:0})">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2v14M2 9l7-7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Réserver ma place
      </button>
      <a class="btn btn-outline-white" href="https://elearning.fdsinstitut.com" target="_blank" rel="noopener">
        Voir la plateforme
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>

    <div class="trust-row">
      <div class="trust-item">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.5l1.57 3.18 3.51.51-2.54 2.47.6 3.5L8 9.41l-3.14 1.75.6-3.5L2.92 5.19l3.51-.51L8 1.5z" fill="rgba(255,255,255,0.65)"/></svg>
        Garantie 14 jours
      </div>
      <div class="trust-item">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="4" width="12" height="9" rx="2" stroke="rgba(255,255,255,0.65)" stroke-width="1.5"/><path d="M5 4V3a3 3 0 016 0v1" stroke="rgba(255,255,255,0.65)" stroke-width="1.5"/></svg>
        Paiement sécurisé DZD
      </div>
      <div class="trust-item">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="rgba(255,255,255,0.65)" stroke-width="1.5"/><path d="M8 5v3.5l2 2" stroke="rgba(255,255,255,0.65)" stroke-width="1.5" stroke-linecap="round"/></svg>
        Cours dès cette semaine
      </div>
    </div>

  </div>
</section>
</body>
</html>
