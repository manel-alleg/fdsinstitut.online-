<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTA Final — FDS Institut DZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Montserrat:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --orange: #FF7900;
    --blue: #00304E;
    --gray-50: #F7F8FA;
    --gray-200: #E2E3E5;
    --gray-500: #6B7280;
    --black: #111;
  }
  body { font-family: 'Montserrat', sans-serif; background: #fff; }

  .section {
    background: var(--blue);
    padding: 88px 24px;
    text-align: center;
  }

  .inner {
    max-width: 640px;
    margin: 0 auto;
  }

  h2 {
    font-family: 'Sora', sans-serif;
    font-size: clamp(1.875rem, 5vw, 3rem);
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.03em;
    line-height: 1.15;
    margin-bottom: 18px;
  }

  .sub {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.0625rem;
    color: rgba(255, 255, 255, 0.7);
    line-height: 1.65;
    margin-bottom: 36px;
  }

  .btn-cta {
    font-family: 'Montserrat', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    background: #fff;
    color: var(--blue);
    border: none;
    border-radius: 10px;
    padding: 15px 36px;
    cursor: pointer;
    transition: opacity 0.15s;
    display: inline-block;
    margin-bottom: 20px;
  }

  .btn-cta:hover { opacity: 0.88; }

  .assurance {
    font-family: 'Nunito', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 0.04em;
    display: block;
  }
</style>
</head>
<body>
  <section class="section">
    <div class="inner">
      <h2>Votre allemand commence cette semaine.</h2>
      <p class="sub">Pas de liste d'attente. Pas de paperasse.</p>
      <button class="btn-cta" onclick="alert('Modal')">Je réserve ma place</button>
      <span class="assurance">Pas de carte requise &nbsp;&middot;&nbsp; Annulation libre</span>
    </div>
  </section>
</body>
</html>
