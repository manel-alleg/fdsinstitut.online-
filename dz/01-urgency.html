<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FDS Institut — Barre d'urgence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#FF7900;
  --orange-2:#FF9100;
  --blue:#00304E;
  --black:#111;
  --gray-50:#F7F8FA;
  --gray-100:#F0F1F3;
  --gray-200:#E2E3E5;
  --gray-500:#6B7280;
  --moodle:#F27F22;
}
body{font-family:'Montserrat',sans-serif;color:var(--black);background:var(--orange);margin:0;padding:0}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
#urgency-bar{
  background:var(--orange);
  padding:.65rem 1rem;
  text-align:center;
  font-family:'Nunito',sans-serif;
  font-weight:700;
  font-size:.82rem;
  color:#fff;
  letter-spacing:.04em;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.6rem;
  width:100%;
  min-height:40px;
}
.pulse-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#fff;
  animation:pulseDot 1.4s ease-in-out infinite;
  flex-shrink:0;
}
</style>
</head>
<body>
<div id="urgency-bar">
  <div class="pulse-dot"></div>
  Nouvelles inscriptions ouvertes &nbsp;·&nbsp; Places limitées &nbsp;·&nbsp; Inscrivez-vous en 2 minutes
</div>
</body>
</html>
