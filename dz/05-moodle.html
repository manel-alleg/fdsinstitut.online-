<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aperçu plateforme — FDS Institut DZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Montserrat:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --orange: #FF7900;
    --blue: #00304E;
    --gray-50: #F7F8FA;
    --gray-200: #E2E3E5;
    --gray-500: #6B7280;
    --black: #111;
  }
  body { font-family: 'Montserrat', sans-serif; background: var(--gray-50); color: var(--black); }

  .section {
    background: var(--gray-50);
    padding: 72px 24px;
  }

  .card {
    max-width: 860px;
    margin: 0 auto;
    background: #fff;
    border: 1.5px solid var(--gray-200);
    border-radius: 20px;
    padding: 40px 48px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 24px;
  }

  @media (min-width: 768px) {
    .card {
      flex-direction: row;
      align-items: center;
    }
  }

  .card-body { flex: 1; }

  .moodle-logo {
    height: 36px;
    width: auto;
    display: block;
    margin-bottom: 20px;
  }

  .card-title {
    font-family: 'Sora', sans-serif;
    font-size: clamp(1.375rem, 3vw, 1.875rem);
    font-weight: 700;
    color: var(--blue);
    letter-spacing: -0.02em;
    margin-bottom: 10px;
  }

  .card-desc {
    font-size: 0.9375rem;
    color: var(--gray-500);
    line-height: 1.65;
    max-width: 440px;
  }

  .card-cta {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .btn-visitor {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.9375rem;
    font-weight: 600;
    background: #F27F22;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px 28px;
    text-decoration: none;
    display: inline-block;
    white-space: nowrap;
    transition: opacity 0.15s;
  }

  .btn-visitor:hover { opacity: 0.88; }

  .no-account {
    font-family: 'Nunito', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--gray-500);
    text-align: center;
  }

  @media (max-width: 767px) {
    .card { padding: 32px 28px; }
    .card-cta { align-items: flex-start; }
  }
</style>
</head>
<body>
  <section class="section">
    <div class="card">
      <div class="card-body">
        <img
          class="moodle-logo"
          src="https://assets.zyrosite.com/tPWPZ3kEpjHdFO9F/moodle-1-740x380-s84vr5GqRxP3NUXr.png"
          alt="Moodle"
        >
        <h2 class="card-title">Testez avant d'acheter.</h2>
        <p class="card-desc">Accédez à un cours complet en mode visiteur &mdash; sans compte, sans engagement.</p>
      </div>
      <div class="card-cta">
        <a class="btn-visitor" href="https://elearning.fdsinstitut.com" target="_blank" rel="noopener">Accès Visiteur &rarr;</a>
        <span class="no-account">Aucun compte requis</span>
      </div>
    </div>
  </section>
</body>
</html>
