<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FDS Institut — Cours d'allemand en ligne · Algérie</title>
<meta name="description" content="Apprenez l'allemand depuis l'Algérie. Cours en direct avec des professeurs certifiés. Tarifs en dinars. CCP · Edahabia · BaridiMob."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
:root{
  --orange:#FF7900;
  --orange-2:#FF9100;
  --blue:#00304E;
  --black:#111;
  --gray-50:#F7F8FA;
  --gray-100:#F0F1F3;
  --gray-200:#E2E3E5;
  --gray-500:#6B7280;
  --moodle:#F27F22;
}
body{font-family:'Montserrat',sans-serif;color:var(--black);background:#fff;line-height:1.6;overflow-x:hidden}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-14px) rotate(var(--r,0deg))}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes spin45{to{transform:rotate(45deg)}}
@keyframes blobMorph{
  0%,100%{border-radius:60% 40% 70% 30%/50% 60% 40% 70%;transform:translate(0,0) scale(1)}
  25%{border-radius:40% 60% 30% 70%/60% 40% 70% 30%;transform:translate(38px,-48px) scale(1.07)}
  50%{border-radius:70% 30% 50% 50%/40% 70% 60% 40%;transform:translate(-28px,28px) scale(.93)}
  75%{border-radius:30% 70% 60% 40%/70% 30% 40% 60%;transform:translate(22px,14px) scale(1.04)}
}
@keyframes popIn{0%{transform:scale(.86);opacity:0}100%{transform:scale(1);opacity:1}}

/* ── CURSOR GLOW ── */
.cursor-glow{position:fixed;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(255,121,0,.17) 0%,rgba(124,58,237,.05) 45%,transparent 70%);pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:left .07s linear,top .07s linear}

/* ── REVEAL ── */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .65s ease,transform .65s ease}
.reveal.in{opacity:1;transform:none}
.reveal-d1{transition-delay:.1s}
.reveal-d2{transition-delay:.2s}
.reveal-d3{transition-delay:.3s}
.reveal-d4{transition-delay:.4s}

/* ── TYPOGRAPHY ── */
h1,h2,h3{font-family:'Sora',sans-serif;line-height:1.12}
.label-font{font-family:'Nunito',sans-serif}
.accent{color:var(--orange)}
.eyebrow{font-family:'Nunito',sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin-bottom:.75rem;display:block}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:.5rem;font-family:'Montserrat',sans-serif;font-weight:600;font-size:.9rem;padding:.75rem 1.5rem;border-radius:10px;border:2px solid transparent;cursor:pointer;transition:all .2s;text-decoration:none;white-space:nowrap}
.btn-orange{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn-orange:hover{background:var(--orange-2);border-color:var(--orange-2);transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,121,0,.35)}
.btn-outline-white{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.btn-outline-white:hover{background:rgba(255,255,255,.1);border-color:#fff}
.btn-outline-dark{background:transparent;color:var(--blue);border-color:var(--gray-200)}
.btn-outline-dark:hover{border-color:var(--orange);color:var(--orange)}
.btn-moodle{background:var(--moodle);color:#fff;border-color:var(--moodle)}
.btn-moodle:hover{background:#e06e15;border-color:#e06e15;transform:translateY(-1px)}
.btn-white{background:#fff;color:var(--blue);border-color:#fff}
.btn-white:hover{background:var(--gray-50)}
.btn-lg{font-size:1rem;padding:.9rem 2rem;border-radius:12px}
.btn-full{width:100%;justify-content:center}

/* ── URGENCY BAR ── */
#urgency-bar{background:var(--orange);padding:.6rem 1rem;text-align:center;font-family:'Nunito',sans-serif;font-weight:700;font-size:.82rem;color:#fff;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:.6rem}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulseDot 1.4s ease-in-out infinite;flex-shrink:0}

/* ── NAV ── */
#nav{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1.5px solid var(--gray-200);height:64px;display:flex;align-items:center}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 1.5rem;width:100%;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.nav-logo{display:flex;align-items:center;gap:.6rem;text-decoration:none}
.logo-text{font-family:'Sora',sans-serif;font-weight:800;font-size:1.5rem;color:var(--blue);line-height:1}
.logo-dot{color:var(--orange)}
.nav-badge{font-family:'Nunito',sans-serif;font-weight:700;font-size:.65rem;background:var(--gray-100);color:var(--blue);padding:.2rem .5rem;border-radius:6px;letter-spacing:.06em}
.nav-actions{display:flex;align-items:center;gap:.75rem}
.nav-intl{font-family:'Montserrat',sans-serif;font-weight:600;font-size:.85rem;color:var(--blue);text-decoration:none;display:flex;align-items:center;gap:.3rem;border:1.5px solid var(--gray-200);padding:.45rem 1rem;border-radius:8px;transition:all .2s}
.nav-intl:hover{border-color:var(--orange);color:var(--orange)}
.nav-cta{font-size:.85rem;padding:.5rem 1.1rem;border-radius:8px}

/* ── HERO ── */
#hero{
  scroll-margin-top:64px;
  background:var(--blue);
  min-height:100vh;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  padding:5rem 1.5rem 4rem;
}
#hero::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.055) 1.5px,transparent 1.5px);background-size:30px 30px;pointer-events:none;z-index:0}

/* ── BLOBS ── */
.blob{position:absolute;filter:blur(72px);pointer-events:none;will-change:transform;z-index:0;animation:blobMorph 10s ease-in-out infinite}
.blob-1{width:680px;height:680px;background:rgba(255,121,0,.4);bottom:-210px;left:-180px;animation-duration:9s}
.blob-2{width:540px;height:540px;background:rgba(124,58,237,.33);top:-140px;right:-130px;animation-duration:13s;animation-delay:-5s;animation-direction:reverse}
.blob-3{width:440px;height:440px;background:rgba(6,182,212,.28);top:28%;left:38%;animation-duration:8s;animation-delay:-3s}
.blob-4{width:300px;height:300px;background:rgba(16,185,129,.22);bottom:4%;right:10%;animation-duration:15s;animation-delay:-8s;animation-direction:reverse}

/* ── FLOATING PHOTOS ── */
.fp{position:absolute;border-radius:18px;overflow:hidden;z-index:3;pointer-events:none;box-shadow:0 24px 60px -8px rgba(0,0,0,.6),0 0 0 3px rgba(255,255,255,.2)}
.fp img{width:100%;height:100%;object-fit:cover;display:block}
.fp1{width:154px;height:154px;top:7%;left:2.5%;animation:float 6.2s ease-in-out infinite;--r:-6deg;transform:rotate(-6deg)}
.fp2{width:122px;height:142px;bottom:15%;left:4%;animation:float 7.8s ease-in-out infinite 1.7s;--r:5deg;transform:rotate(5deg)}
.fp3{width:142px;height:132px;top:5%;right:2.5%;animation:float 8.4s ease-in-out infinite .6s;--r:4deg;transform:rotate(4deg)}
.fp4{width:112px;height:122px;bottom:17%;right:3%;animation:float 5.6s ease-in-out infinite 2.2s;--r:-5deg;transform:rotate(-5deg)}
.fp5{width:100px;height:100px;top:43%;left:1.2%;animation:float 9.1s ease-in-out infinite .3s;--r:7deg;transform:rotate(7deg)}
@media(max-width:1200px){.fp1,.fp2,.fp3,.fp4,.fp5{display:none}}

.hero-inner{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 480px;gap:3.5rem;align-items:center;position:relative;z-index:4;width:100%}
.hero-eyebrow{display:inline-flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);border-radius:100px;padding:.35rem .8rem .35rem .5rem;font-family:'Nunito',sans-serif;font-weight:700;font-size:.75rem;color:#fff;margin-bottom:1.25rem}
.green-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulseDot 1.4s ease-in-out infinite;flex-shrink:0}
.hero-h1{font-size:clamp(3rem,6vw,5rem);font-weight:800;color:#fff;margin-bottom:1.25rem}
.hero-sub{font-size:1.05rem;color:rgba(255,255,255,.78);max-width:480px;margin-bottom:1.75rem;line-height:1.7}
.trust-pills{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1.75rem}
.trust-pill{display:flex;align-items:center;gap:.6rem;font-family:'Nunito',sans-serif;font-weight:700;font-size:.85rem;color:#fff}
.trust-pill svg{flex-shrink:0}
.hero-divider{border:none;border-top:1.5px solid rgba(255,255,255,.15);margin:1.5rem 0}
.avatar-row{display:flex;align-items:center;gap:.75rem}
.avatar-stack{display:flex}
.avatar-stack .av{width:36px;height:36px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);background:var(--blue);color:#fff;font-family:'Nunito',sans-serif;font-weight:800;font-size:.65rem;display:flex;align-items:center;justify-content:center;margin-left:-10px}
.avatar-stack .av:first-child{margin-left:0}
.avatar-stack .av:nth-child(2){background:#FF7900}
.avatar-stack .av:nth-child(3){background:#22c55e}
.avatar-stack .av:nth-child(4){background:#7c3aed}
.avatar-row-text{font-family:'Nunito',sans-serif;font-weight:700;font-size:.8rem;color:rgba(255,255,255,.7)}
.avatar-row-text strong{color:#fff;display:block;font-size:.9rem}

/* ── HERO PHOTOS ── */
.hero-photos { display: flex; margin-bottom: 1.5rem; }
.hero-photo-card {
  width: 56px; height: 56px; border-radius: 14px; overflow: hidden;
  border: 2.5px solid rgba(255,255,255,.3); margin-left: -10px;
  box-shadow: 0 4px 12px rgba(0,0,0,.3); transition: transform .25s;
}
.hero-photo-card:first-child { margin-left: 0; }
.hero-photo-card:hover { transform: translateY(-4px) scale(1.08); z-index: 1; }
.hero-photo-card img { width: 100%; height: 100%; object-fit: cover; }

/* ── FORM CARD ── */
.form-wrap{max-width:700px}
.form-card{background:#fff;border-radius:24px;padding:3rem 3.25rem;box-shadow:0 50px 120px -20px rgba(0,0,0,.42),0 0 0 1px rgba(0,0,0,.04),0 20px 60px -30px rgba(255,121,0,.35);width:100%;animation:popIn .55s cubic-bezier(.175,.885,.32,1.275) both}
.form-card-label{font-family:'Nunito',sans-serif;font-weight:800;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);margin-bottom:1rem;display:block}
.form-dots{display:flex;gap:.4rem;margin-bottom:1.5rem}
.form-dot{width:32px;height:4px;border-radius:4px;background:var(--gray-200);transition:all .3s}
.form-dot.active{background:var(--orange)}
.form-dot.done{background:var(--orange);opacity:.4}
.form-step{display:none}
.form-step.active{display:block}
.step-q{font-family:'Sora',sans-serif;font-weight:700;font-size:1rem;color:var(--blue);margin-bottom:1rem}
.option-list{display:flex;flex-direction:column;gap:.5rem}
.opt-card{border:1.5px solid var(--gray-200);border-radius:12px;padding:.7rem 1rem;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:space-between;font-family:'Montserrat',sans-serif;font-weight:500;font-size:.88rem;color:var(--black)}
.opt-card:hover{border-color:var(--orange);background:#fff9f5}
.opt-card.selected{border-color:var(--orange);background:#fff3e8;font-weight:600;color:var(--blue)}
.opt-badge{font-family:'Nunito',sans-serif;font-weight:800;font-size:.72rem;background:var(--gray-100);color:var(--orange);padding:.18rem .5rem;border-radius:6px;white-space:nowrap}
.opt-card.selected .opt-badge{background:var(--orange);color:#fff}
.step-back{display:inline-flex;align-items:center;gap:.3rem;font-family:'Montserrat',sans-serif;font-weight:600;font-size:.8rem;color:var(--gray-500);border:none;background:none;cursor:pointer;padding:.3rem 0;margin-top:.75rem;transition:color .2s}
.step-back:hover{color:var(--blue)}
.form-fields{display:flex;flex-direction:column;gap:.75rem}
.form-field label{font-family:'Nunito',sans-serif;font-weight:700;font-size:.75rem;color:var(--blue);display:block;margin-bottom:.3rem}
.form-field input{width:100%;border:1.5px solid var(--gray-200);border-radius:10px;padding:.65rem .9rem;font-family:'Montserrat',sans-serif;font-size:.9rem;color:var(--black);outline:none;transition:border-color .2s}
.form-field input:focus{border-color:var(--orange)}
.form-field input::placeholder{color:var(--gray-500)}
.form-step-4-meta{font-family:'Nunito',sans-serif;font-weight:600;font-size:.73rem;color:var(--gray-500);text-align:center;margin-top:.6rem}
.form-success{display:none;text-align:center;padding:1rem 0}
.form-success .success-icon{margin:0 auto 1rem;width:64px;height:64px;border-radius:50%;background:#dcfce7;display:flex;align-items:center;justify-content:center}
.form-success h3{font-family:'Sora',sans-serif;font-weight:700;font-size:1.1rem;color:var(--blue);margin-bottom:.6rem}
.form-success p{font-family:'Montserrat',sans-serif;font-size:.85rem;color:var(--gray-500);margin-bottom:.5rem}
.form-success a{color:var(--orange);font-weight:600;font-size:.82rem}

/* ── STATS BAR ── */
#stats{background:var(--blue);padding:3.5rem 1.5rem}
.stats-inner{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem}
.stat-item{text-align:center}
.stat-num{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(2rem,4vw,2.75rem);color:#fff;line-height:1;margin-bottom:.35rem}
.stat-label{font-family:'Nunito',sans-serif;font-weight:600;font-size:.8rem;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.06em}

/* ── IMAGE SECTION ── */
#image-section{min-height:480px;position:relative;display:flex;align-items:center;background:url('https://images.pexels.com/photos/4144923/pexels-photo-4144923.jpeg?auto=compress&cs=tinysrgb&w=1400') center/cover no-repeat}
.image-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,48,78,.92) 0%,rgba(0,48,78,.5) 60%,rgba(0,48,78,.05) 100%)}
.image-content{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:4rem 1.5rem;max-width:600px}
.image-eyebrow-line{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem}
.orange-line{width:36px;height:3px;background:var(--orange);border-radius:2px}
.image-eyebrow-line span{font-family:'Nunito',sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--orange)}
.image-content h2{font-size:clamp(1.6rem,3.5vw,2.5rem);font-weight:800;color:#fff;margin-bottom:1rem}
.image-content p{font-size:1rem;color:rgba(255,255,255,.8);margin-bottom:1.75rem;line-height:1.7}

/* ── VIDEO SECTION ── */
.video-section { padding: 5rem 1.5rem; background: var(--gray-50); }
@media(min-width:1024px){.video-section{padding:6rem 3rem}}
.video-inner { max-width: 64rem; margin: 0 auto; }
.video-card { border-radius: 20px; overflow: hidden; box-shadow: 0 32px 80px -16px rgba(0,0,0,.18); }
.video-thumb { position: relative; cursor: pointer; aspect-ratio: 16/9; overflow: hidden; }
.video-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
.video-thumb:hover img { transform: scale(1.03); }
.video-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.1) 0%, rgba(0,0,0,.5) 100%); }
.play-btn {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 80px; height: 80px; border-radius: 50%; background: var(--orange); color: #fff;
  border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 32px rgba(255,121,0,.5); transition: transform .25s, box-shadow .25s; padding-left: 4px;
}
.video-thumb:hover .play-btn { transform: translate(-50%,-50%) scale(1.1); box-shadow: 0 12px 40px rgba(255,121,0,.6); }
.video-caption {
  position: absolute; bottom: 1.25rem; left: 1.25rem;
  background: rgba(0,0,0,.6); backdrop-filter: blur(8px); color: #fff;
  border-radius: 999px; padding: .4rem 1rem;
  font-family: 'Nunito', sans-serif; font-weight: 700; font-size: .75rem;
  display: flex; align-items: center; gap: .5rem;
}
.video-cap-dot { width: 7px; height: 7px; border-radius: 50%; background: #EF4444; animation: pulseDot 1.4s ease infinite; }
.section-eyebrow { font-family: 'Nunito', sans-serif; font-weight: 700; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--orange); margin-bottom: .5rem; display: block; }
.section-title { font-family: 'Sora', sans-serif; font-weight: 800; font-size: clamp(1.6rem,3vw,2.25rem); color: var(--blue); margin-top: .5rem; }

/* ── FEATURES ── */
#features{background:#fff;padding:5rem 1.5rem}
.section-inner{max-width:1200px;margin:0 auto}
.section-header{text-align:center;margin-bottom:3rem}
.section-header h2{font-size:clamp(1.6rem,3vw,2.25rem);font-weight:800;color:var(--blue);margin-top:.5rem}
.features-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.5rem}
.feat-card{border:1.5px solid var(--gray-200);border-radius:20px;padding:2rem;transition:all .25s}
.feat-card:hover{border-color:var(--orange);box-shadow:0 8px 32px rgba(255,121,0,.12);transform:translateY(-4px)}
.feat-icon{width:48px;height:48px;border-radius:14px;background:#fff3e8;display:flex;align-items:center;justify-content:center;margin-bottom:1.25rem}
.feat-card h3{font-family:'Sora',sans-serif;font-weight:700;font-size:1rem;color:var(--blue);margin-bottom:.5rem}
.feat-card p{font-size:.88rem;color:var(--gray-500);line-height:1.6}

/* ── FEATURES PHOTO ROW ── */
.features-photo-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 1.25rem; margin-top: 2rem; }
@media(max-width:640px){.features-photo-row{grid-template-columns:1fr}}
.feat-photo { border-radius: 16px; overflow: hidden; position: relative; aspect-ratio: 4/3; box-shadow: 0 8px 24px rgba(0,0,0,.1); }
.feat-photo img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }
.feat-photo:hover img { transform: scale(1.04); }
.feat-photo-caption { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(0deg,rgba(0,0,0,.7) 0%,transparent 100%); color: #fff; padding: 1.5rem .875rem .875rem; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; }

/* ── MOODLE ── */
#moodle{background:linear-gradient(135deg,#FFF8F4 0%,#FFF3E8 40%,#F7F8FA 100%);padding:5rem 1.5rem}
.moodle-inner{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:3.5rem;align-items:center}
.moodle-left h2{font-size:clamp(1.5rem,2.5vw,2.1rem);font-weight:800;color:var(--blue);margin:1rem 0 .75rem}
.moodle-left p{font-size:.95rem;color:var(--gray-500);margin-bottom:1.5rem;line-height:1.7}
.moodle-checks{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1.75rem}
.moodle-check{display:flex;align-items:center;gap:.6rem;font-family:'Nunito',sans-serif;font-weight:700;font-size:.88rem;color:var(--blue)}
.moodle-img-wrap{position:relative;border-radius:20px;overflow:hidden;height:340px}
.moodle-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.moodle-badge{position:absolute;bottom:1rem;left:1rem;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border-radius:10px;padding:.45rem .8rem;display:flex;align-items:center;gap:.5rem;font-family:'Nunito',sans-serif;font-weight:700;font-size:.75rem;color:#fff}

/* ── MOODLE ENHANCEMENTS ── */
.moodle-logo-box {
  display: inline-block; background: #fff; border: 1.5px solid var(--gray-200);
  border-radius: 16px; padding: .75rem 1.5rem; margin-bottom: 1.75rem;
  box-shadow: 0 4px 16px rgba(0,0,0,.06);
}
.moodle-stats {
  display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1.75rem;
  padding: 1rem 1.25rem; background: rgba(255,121,0,.06);
  border-radius: 12px; border: 1px solid rgba(255,121,0,.15);
}
.moodle-stat { display: flex; flex-direction: column; }
.moodle-stat-num { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 1.375rem; color: var(--orange); line-height: 1; }
.moodle-stat-lbl { font-family: 'Nunito', sans-serif; font-weight: 700; font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--gray-500); margin-top: .2rem; }
.moodle-ring { position: absolute; bottom: -24px; right: -24px; width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--orange); opacity: .25; pointer-events: none; }

/* ── PRICING ── */
#pricing{background:#fff;padding:5rem 1.5rem}
.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;max-width:1200px;margin:0 auto}
.price-card{border:1.5px solid var(--gray-200);border-radius:24px;padding:2rem;display:flex;flex-direction:column;position:relative}
.price-card.highlight{border-color:var(--orange);box-shadow:0 8px 40px rgba(255,121,0,.18)}
.pop-badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--orange);color:#fff;font-family:'Nunito',sans-serif;font-weight:800;font-size:.7rem;padding:.25rem .75rem;border-radius:100px;white-space:nowrap;letter-spacing:.04em}
.price-plan{font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-500);margin-bottom:.75rem}
.price-amount{font-family:'Sora',sans-serif;font-weight:800;font-size:2rem;color:var(--blue);line-height:1;margin-bottom:.2rem}
.price-amount span{font-size:.9rem;font-weight:600;color:var(--gray-500)}
.price-period{font-family:'Nunito',sans-serif;font-weight:600;font-size:.75rem;color:var(--gray-500);margin-bottom:1.5rem}
.price-features{list-style:none;display:flex;flex-direction:column;gap:.55rem;margin-bottom:1.75rem;flex:1}
.price-features li{display:flex;align-items:flex-start;gap:.5rem;font-size:.85rem;color:var(--black);line-height:1.5}
.price-features li svg{flex-shrink:0;margin-top:2px}
.pricing-assurance{text-align:center;margin-top:1.75rem;font-family:'Nunito',sans-serif;font-weight:700;font-size:.8rem;color:var(--gray-500)}
.pricing-payment{text-align:center;margin-top:.5rem;font-family:'Nunito',sans-serif;font-weight:600;font-size:.78rem;color:var(--gray-500)}

/* ── TESTIMONIALS ── */
#testimonials{background:var(--gray-50);padding:5rem 1.5rem}
.testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;max-width:1200px;margin:0 auto}
.testi-card{border-radius:20px;padding:1.75rem;display:flex;flex-direction:column;gap:1rem}
.testi-card.light{background:#fff;border:1.5px solid var(--gray-200)}
.testi-card.dark{background:var(--blue);border:1.5px solid var(--blue)}
.testi-stars{display:flex;gap:.15rem}
.testi-quote{font-size:.9rem;line-height:1.65;flex:1}
.testi-card.light .testi-quote{color:var(--black)}
.testi-card.dark .testi-quote{color:rgba(255,255,255,.85)}
.testi-author{display:flex;align-items:center;gap:.75rem}
.testi-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:.75rem;flex-shrink:0}
.av-orange{background:#fff3e8;color:var(--orange)}
.av-glass{background:rgba(255,255,255,.15);color:#fff}
.testi-name{font-family:'Nunito',sans-serif;font-weight:800;font-size:.88rem}
.testi-card.light .testi-name{color:var(--blue)}
.testi-card.dark .testi-name{color:#fff}
.testi-meta{font-family:'Montserrat',sans-serif;font-size:.75rem}
.testi-card.light .testi-meta{color:var(--gray-500)}
.testi-card.dark .testi-meta{color:rgba(255,255,255,.5)}

/* ── GUARANTEE ── */
#guarantee{background:linear-gradient(135deg,#FF7900 0%,#FF9100 100%);padding:4rem 1.5rem;text-align:center}
#guarantee h2{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(1.5rem,3vw,2.25rem);color:#fff;margin:1.25rem 0 .75rem}
#guarantee p{font-size:1rem;color:rgba(255,255,255,.88);margin-bottom:1.75rem;max-width:520px;margin-left:auto;margin-right:auto;line-height:1.7}
.shield-icon{margin:0 auto .5rem;display:flex;justify-content:center}

/* ── FAQ ── */
#faq{background:var(--gray-50);padding:5rem 1.5rem}
.faq-list{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:.75rem}
.faq-item{background:#fff;border:1.5px solid var(--gray-200);border-radius:16px;overflow:hidden;transition:border-color .2s}
.faq-item.open{border-color:var(--orange)}
.faq-q{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.25rem;cursor:pointer;gap:1rem}
.faq-q-text{font-family:'Sora',sans-serif;font-weight:700;font-size:.92rem;color:var(--blue)}
.faq-icon{width:24px;height:24px;flex-shrink:0;border:1.5px solid var(--gray-200);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .25s}
.faq-item.open .faq-icon{border-color:var(--orange);background:var(--orange);transform:rotate(45deg)}
.faq-item.open .faq-icon svg path,.faq-item.open .faq-icon svg line{stroke:#fff}
.faq-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}
.faq-item.open .faq-body{grid-template-rows:1fr}
.faq-body-inner{overflow:hidden}
.faq-a{padding:0 1.25rem 1.1rem;font-size:.88rem;color:var(--gray-500);line-height:1.7}

/* ── FINAL CTA ── */
#final-cta{background:var(--blue);padding:5rem 1.5rem;text-align:center}
#final-cta h2{font-size:clamp(1.8rem,4vw,3rem);font-weight:800;color:#fff;margin-bottom:1rem}
#final-cta p{font-size:1rem;color:rgba(255,255,255,.7);margin-bottom:2rem;max-width:480px;margin-left:auto;margin-right:auto}
.final-btns{display:flex;align-items:center;justify-content:center;gap:1rem;flex-wrap:wrap}

/* ── FOOTER ── */
#footer{background:#fff;border-top:1.5px solid var(--gray-200);padding:3rem 1.5rem 1.5rem}
.footer-inner{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2rem;padding-bottom:2rem;border-bottom:1px solid var(--gray-200);margin-bottom:1.5rem}
.footer-brand-name{font-family:'Sora',sans-serif;font-weight:800;font-size:1.4rem;color:var(--blue);margin-bottom:.35rem}
.footer-tagline{font-size:.82rem;color:var(--gray-500);margin-bottom:.75rem}
.footer-copy{font-size:.75rem;color:var(--gray-500)}
.footer-col h4{font-family:'Nunito',sans-serif;font-weight:800;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:.75rem}
.footer-nav{list-style:none;display:flex;flex-direction:column;gap:.4rem}
.footer-nav a,.footer-nav button{font-size:.85rem;color:var(--gray-500);text-decoration:none;font-family:'Montserrat',sans-serif;background:none;border:none;cursor:pointer;padding:0;transition:color .2s;text-align:left}
.footer-nav a:hover,.footer-nav button:hover{color:var(--orange)}
.footer-contact-item{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--gray-500);margin-bottom:.4rem;text-decoration:none}
.footer-contact-item:hover{color:var(--orange)}
.footer-bottom{text-align:center;font-size:.75rem;color:var(--gray-500)}

/* ── MOBILE STICKY CTA ── */
#mobile-cta{position:fixed;bottom:0;left:0;right:0;z-index:200;background:#fff;border-top:1.5px solid var(--gray-200);padding:.75rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
@media(min-width:1024px){#mobile-cta{display:none}}
.mobile-cta-text-price{font-family:'Sora',sans-serif;font-weight:800;font-size:1rem;color:var(--blue)}
.mobile-cta-text-sub{font-family:'Nunito',sans-serif;font-weight:600;font-size:.75rem;color:var(--gray-500)}

/* ── SUCCESS BANNER ── */
#success-banner{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(120%);z-index:500;background:var(--blue);color:#fff;border-radius:100px;padding:.75rem 1.5rem;display:flex;align-items:center;gap:.65rem;font-family:'Nunito',sans-serif;font-weight:700;font-size:.85rem;box-shadow:0 8px 32px rgba(0,0,0,.2);white-space:nowrap;transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .4s}
#success-banner.show{transform:translateX(-50%) translateY(0);animation:none}

.med-promo-banner{background:var(--blue);padding:2.5rem 1.5rem;border-top:3px solid var(--orange)}
.med-promo-inner{max-width:80rem;margin:0 auto;display:flex;align-items:center;gap:2rem;flex-wrap:wrap}
.med-promo-photos{display:flex;flex-shrink:0}
.med-promo-photo{width:56px;height:56px;border-radius:14px;overflow:hidden;border:2.5px solid rgba(255,255,255,.3);margin-left:-10px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.med-promo-photo:first-child{margin-left:0}
.med-promo-photo img{width:100%;height:100%;object-fit:cover}
.med-promo-text{flex:1;min-width:200px}
.med-promo-eyebrow{font-family:'Nunito',sans-serif;font-weight:800;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);display:block;margin-bottom:.3rem}
.med-promo-h3{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(1rem,2.5vw,1.35rem);color:#fff;line-height:1.2;margin-bottom:.3rem}
.med-promo-sub{font-family:'Nunito',sans-serif;font-weight:600;font-size:.78rem;color:rgba(255,255,255,.7);line-height:1.4}
.med-promo-btn{display:inline-flex;align-items:center;font-family:'Montserrat',sans-serif;font-weight:700;font-size:.88rem;background:var(--orange);color:#fff;border-radius:10px;padding:.75rem 1.5rem;white-space:nowrap;transition:all .2s;text-decoration:none;flex-shrink:0}
.med-promo-btn:hover{background:var(--orange-2);transform:translateY(-1px)}
@media(max-width:600px){.med-promo-inner{flex-direction:column;text-align:center}.med-promo-photos{justify-content:center}.med-promo-btn{width:100%;justify-content:center}}

/* ── RESPONSIVE ── */
@media(max-width:1023px){
  .hero-inner{grid-template-columns:1fr;gap:2.5rem}
  .moodle-inner{grid-template-columns:1fr;gap:2rem}
  .features-grid{grid-template-columns:1fr}
  .pricing-grid{grid-template-columns:1fr}
  .price-card.highlight{order:-1}
  .testi-grid{grid-template-columns:1fr}
  .stats-inner{grid-template-columns:repeat(2,1fr)}
  .footer-inner{grid-template-columns:1fr;gap:1.5rem}
  .nav-intl{display:none}
  #hero{padding:3.5rem 1.25rem 3rem}
  body{padding-bottom:72px}
}
@media(max-width:600px){
  .stats-inner{grid-template-columns:repeat(2,1fr)}
  .hero-h1{font-size:2.6rem}
  .form-card{padding:2rem 1.75rem}
  #final-cta{padding:3.5rem 1.25rem}
  .final-btns{flex-direction:column}
  .final-btns .btn{width:100%;justify-content:center}
}
</style>
</head>
