<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDS Institut — FAQ (DZ)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Montserrat:wght@700;900&family=JetBrains+Mono:wght@400&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{background:#030712;color:#fff;font-family:'Poppins',sans-serif}
h2{font-family:'Montserrat',sans-serif;letter-spacing:-.02em}
:root{--orange:#f97316;--ink:#15233c}
::selection{background:var(--orange);color:var(--ink)}
.label-mono{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase}

section{max-width:48rem;margin:0 auto;padding:4rem 1.5rem 5rem}
@media(min-width:1024px){section{padding:5rem 2rem}}
.header{margin-bottom:3rem}
.eyebrow{color:var(--orange);margin-bottom:.75rem}
h2{font-size:clamp(2.25rem,6vw,3.75rem);font-weight:900;line-height:.95;color:#fff}
.faq-list{display:grid;gap:.75rem}
.faq-item{border-radius:1.25rem;border:1px solid;overflow:hidden;transition:border-color .2s,background .2s}
.faq-item.closed{border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.03)}
.faq-item.closed:hover{border-color:rgba(249,115,22,.4)}
.faq-item.open{border-color:var(--orange);background:rgba(249,115,22,.1)}
.faq-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.25rem 1.5rem;background:none;border:none;cursor:pointer;text-align:left;font-family:'Poppins',sans-serif}
.faq-q{font-family:'Montserrat',sans-serif;font-weight:700;font-size:1rem;color:#fff;padding-right:1rem}
@media(min-width:640px){.faq-q{font-size:1.125rem}}
.faq-icon{flex-shrink:0;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.125rem;transition:transform .3s,background .3s,color .3s}
.faq-item.closed .faq-icon{background:rgba(255,255,255,.1);color:#fff}
.faq-item.open .faq-icon{background:var(--orange);color:var(--ink);transform:rotate(45deg)}
.faq-body{display:grid;grid-template-rows:0fr;overflow:hidden;transition:grid-template-rows .3s ease}
.faq-item.open .faq-body{grid-template-rows:1fr}
.faq-body-inner{overflow:hidden}
.faq-a{padding:0 1.5rem 1.5rem;color:rgba(255,255,255,.6);line-height:1.7}
</style>
</head>
<body>
<section>
  <div class="header">
    <p class="label-mono eyebrow">— FAQ</p>
    <h2>Vos questions, nos réponses.</h2>
  </div>
  <div class="faq-list" id="faq"></div>
</section>
<script>
const FAQS = [
  {q:"Les certificats sont-ils reconnus ?",a:"Nos certificats internes suivent les standards CEFR (A1–C2). Nous vous préparons aussi aux examens officiels Goethe / TestDaF que vous passez en centre agréé."},
  {q:"Comment payer depuis l'Algérie ?",a:"CCP, BaridiMob, Edahabia, ou virement bancaire local. Pas besoin de carte internationale."},
  {q:"Si je rate un cours en direct ?",a:"Tous les cours sont enregistrés. Vous avez accès aux replays + résumé écrit pendant toute la durée du programme."},
  {q:"Quel matériel faut-il ?",a:"Juste un navigateur web et une connexion. Mobile ou ordinateur. Pas de logiciel à installer."},
  {q:"Puis-je changer de formule ?",a:"Oui. Vous pouvez passer de l'auto-apprentissage au groupe, ou passer à l'Intensif en complément à tout moment."},
];
const list=document.getElementById('faq');
FAQS.forEach(f=>{
  const item=document.createElement('div');
  item.className='faq-item closed';
  item.innerHTML=`
    <button class="faq-trigger" aria-expanded="false">
      <span class="faq-q">${f.q}</span>
      <span class="faq-icon">+</span>
    </button>
    <div class="faq-body"><div class="faq-body-inner"><p class="faq-a">${f.a}</p></div></div>`;
  item.querySelector('.faq-trigger').addEventListener('click',()=>{
    const isOpen=item.classList.contains('open');
    document.querySelectorAll('.faq-item').forEach(el=>{el.className='faq-item closed';el.querySelector('.faq-trigger').setAttribute('aria-expanded','false')});
    if(!isOpen){item.className='faq-item open';item.querySelector('.faq-trigger').setAttribute('aria-expanded','true')}
  });
  list.appendChild(item);
});
</script>
</body>
</html>
