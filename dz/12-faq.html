<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ — FDS Institut DZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Montserrat:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --orange: #FF7900;
    --blue: #00304E;
    --gray-50: #F7F8FA;
    --gray-200: #E2E3E5;
    --gray-500: #6B7280;
    --black: #111;
  }
  body { font-family: 'Montserrat', sans-serif; background: #fff; color: var(--black); }

  .section {
    background: #fff;
    padding: 80px 24px;
    max-width: 720px;
    margin: 0 auto;
  }

  .section-label {
    font-family: 'Nunito', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--orange);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  h2 {
    font-family: 'Sora', sans-serif;
    font-size: clamp(1.875rem, 4vw, 2.625rem);
    font-weight: 700;
    color: var(--blue);
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 48px;
  }

  .faq-list { display: grid; gap: 10px; }

  .faq-item {
    border: 1.5px solid var(--gray-200);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s;
    background: #fff;
  }

  .faq-item.open {
    border-color: var(--orange);
    background: #fff;
  }

  .faq-trigger {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 20px;
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    font-family: 'Sora', sans-serif;
    font-size: 0.9375rem;
    font-weight: 600;
    color: var(--blue);
    line-height: 1.4;
  }

  .faq-icon {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--gray-50);
    border: 1.5px solid var(--gray-200);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.125rem;
    font-weight: 700;
    color: var(--gray-500);
    transition: transform 0.25s, background 0.2s, color 0.2s, border-color 0.2s;
    line-height: 1;
  }

  .faq-item.open .faq-icon {
    background: var(--orange);
    color: #fff;
    border-color: var(--orange);
    transform: rotate(45deg);
  }

  .faq-body {
    display: grid;
    grid-template-rows: 0fr;
    overflow: hidden;
    transition: grid-template-rows 0.28s ease;
  }

  .faq-item.open .faq-body { grid-template-rows: 1fr; }

  .faq-body-inner { overflow: hidden; }

  .faq-answer {
    padding: 0 20px 18px;
    font-size: 0.9375rem;
    color: var(--gray-500);
    line-height: 1.7;
  }
</style>
</head>
<body>
  <section class="section">
    <p class="section-label">FAQ</p>
    <h2>Vos questions, nos réponses.</h2>
    <div class="faq-list" id="faq"></div>
  </section>

  <script>
    const FAQS = [
      {
        q: "Les certificats sont-ils reconnus ?",
        a: "Nos certificats internes suivent les standards CEFR (A1&ndash;C2). Nous vous préparons également aux examens officiels Goethe / TestDaF que vous passez en centre agréé."
      },
      {
        q: "Comment payer depuis l'Algérie ?",
        a: "CCP, BaridiMob, Edahabia, ou virement bancaire local. Pas besoin de carte internationale."
      },
      {
        q: "Si je rate un cours en direct ?",
        a: "Tous les cours sont enregistrés. Vous avez accès aux replays et à un résumé écrit pendant toute la durée du programme."
      },
      {
        q: "Quel matériel faut-il ?",
        a: "Juste un navigateur web et une connexion. Mobile ou ordinateur. Aucun logiciel à installer."
      },
      {
        q: "Puis-je changer de formule ?",
        a: "Oui, à tout moment. Vous pouvez passer d'une formule à une autre et le solde restant est reporté."
      }
    ];

    const list = document.getElementById('faq');
    FAQS.forEach(f => {
      const item = document.createElement('div');
      item.className = 'faq-item closed';
      item.innerHTML = `
        <button class="faq-trigger" aria-expanded="false">
          <span>${f.q}</span>
          <span class="faq-icon" aria-hidden="true">+</span>
        </button>
        <div class="faq-body">
          <div class="faq-body-inner">
            <p class="faq-answer">${f.a}</p>
          </div>
        </div>`;
      item.querySelector('.faq-trigger').addEventListener('click', () => {
        const isOpen = item.classList.contains('open');
        document.querySelectorAll('.faq-item').forEach(el => {
          el.className = 'faq-item';
          el.querySelector('.faq-trigger').setAttribute('aria-expanded', 'false');
        });
        if (!isOpen) {
          item.className = 'faq-item open';
          item.querySelector('.faq-trigger').setAttribute('aria-expanded', 'true');
        }
      });
      list.appendChild(item);
    });
  </script>
</body>
</html>
