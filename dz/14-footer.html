<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pied de page — FDS Institut DZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Montserrat:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --orange: #FF7900;
    --blue: #00304E;
    --gray-50: #F7F8FA;
    --gray-200: #E2E3E5;
    --gray-500: #6B7280;
    --black: #111;
  }
  body { font-family: 'Montserrat', sans-serif; background: #fff; color: var(--black); }

  footer {
    background: #fff;
    border-top: 1.5px solid var(--gray-200);
    padding: 56px 24px 32px;
  }

  .inner { max-width: 1120px; margin: 0 auto; }

  .top {
    display: grid;
    gap: 40px;
    grid-template-columns: 1fr;
    margin-bottom: 40px;
  }

  @media (min-width: 640px) {
    .top { grid-template-columns: 1.5fr 1fr 1fr; }
  }

  .brand-logo {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--blue);
    letter-spacing: -0.03em;
    margin-bottom: 10px;
    display: block;
  }

  .brand-logo .dot { color: var(--orange); }

  .brand-desc {
    font-size: 0.875rem;
    color: var(--gray-500);
    line-height: 1.65;
    max-width: 240px;
  }

  .col-label {
    font-family: 'Nunito', sans-serif;
    font-size: 0.6875rem;
    font-weight: 700;
    color: var(--gray-500);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 16px;
    display: block;
  }

  .link-list { list-style: none; display: grid; gap: 10px; }

  .link-list a {
    font-size: 0.875rem;
    color: var(--black);
    text-decoration: none;
    transition: color 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .link-list a:hover { color: var(--orange); }

  .ext-arrow {
    font-size: 0.75rem;
    color: var(--gray-500);
  }

  .bottom {
    border-top: 1px solid var(--gray-200);
    padding-top: 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .copy {
    font-family: 'Nunito', sans-serif;
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--gray-500);
  }

  .secure {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--gray-500);
  }

  .secure-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--orange);
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <footer>
    <div class="inner">
      <div class="top">
        <div>
          <span class="brand-logo">FDS<span class="dot">.</span></span>
          <p class="brand-desc">Cours d'allemand en ligne pour le monde entier et l'Algérie.</p>
        </div>
        <div>
          <span class="col-label">Navigation</span>
          <ul class="link-list">
            <li><a href="/">Accueil</a></li>
            <li><a href="#">Algérie</a></li>
            <li><a href="../global/index.html">International</a></li>
            <li><a href="#pricing">Tarifs</a></li>
          </ul>
        </div>
        <div>
          <span class="col-label">Contact</span>
          <ul class="link-list">
            <li><a href="mailto:online@fdsinstitut.com">online@fdsinstitut.com</a></li>
            <li>
              <a href="https://www.fdsinstitut.com" target="_blank" rel="noopener">
                fdsinstitut.com
                <span class="ext-arrow">&#8599;</span>
              </a>
            </li>
            <li>
              <a href="https://elearning.fdsinstitut.com" target="_blank" rel="noopener">
                elearning.fdsinstitut.com
                <span class="ext-arrow">&#8599;</span>
              </a>
            </li>
          </ul>
        </div>
      </div>

      <div class="bottom">
        <span class="copy">&copy; 2026 FDS Institut &middot; Tous droits réservés</span>
        <span class="secure">
          <span class="secure-dot"></span>
          Plateforme sécurisée
        </span>
      </div>
    </div>
  </footer>
</body>
</html>
