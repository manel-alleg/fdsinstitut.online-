<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDS Institut — Pied de page (DZ)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&family=Montserrat:wght@900&family=JetBrains+Mono:wght@400&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{background:#030712;color:#fff;font-family:'Poppins',sans-serif}
a{color:inherit;text-decoration:none}
:root{--orange:#f97316;--ink:#15233c;--mint:#86efac}
::selection{background:var(--orange);color:var(--ink)}
.label-mono{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase}

footer{border-top:1px solid rgba(255,255,255,.05);padding:3rem 1.5rem}
@media(min-width:1024px){footer{padding:3rem}}
.inner{max-width:80rem;margin:0 auto}
.top{display:grid;gap:2.5rem;margin-bottom:2.5rem;grid-template-columns:1fr}
@media(min-width:640px){.top{grid-template-columns:repeat(3,1fr)}}
.logo{font-family:'Montserrat',sans-serif;font-weight:900;font-size:1.5rem;color:#fff;margin-bottom:.5rem}
.logo .dot{color:var(--orange)}
.logo .inst{color:rgba(255,255,255,.3);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;margin-left:.5rem}
.brand-desc{font-size:.875rem;color:rgba(255,255,255,.4);line-height:1.6;max-width:220px}
.col-label{color:rgba(255,255,255,.3);margin-bottom:1rem}
.link-list{list-style:none;display:grid;gap:.5rem}
.link-list a{font-size:.875rem;color:rgba(255,255,255,.5);transition:color .2s}
.link-list a:hover{color:#fff}
.arrow-out{color:rgba(255,255,255,.2)}
.bottom{border-top:1px solid rgba(255,255,255,.05);padding-top:1.5rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem}
.copy{color:rgba(255,255,255,.25)}
.secure{display:flex;align-items:center;gap:.5rem;color:rgba(255,255,255,.25)}
.secure-dot{width:6px;height:6px;border-radius:50%;background:var(--mint)}
</style>
</head>
<body>
<footer>
  <div class="inner">
    <div class="top">
      <div>
        <div class="logo">FDS<span class="dot">.</span><span class="inst">ONLINE</span></div>
        <p class="brand-desc">Cours d'allemand en ligne pour le monde entier et l'Algérie.</p>
      </div>
      <div>
        <p class="label-mono col-label">Navigation</p>
        <ul class="link-list">
          <li><a href="/">Accueil</a></li>
          <li><a href="/dz">🇩🇿 Algérie</a></li>
          <li><a href="/global">🌍 International</a></li>
          <li><a href="#pricing">Tarifs</a></li>
        </ul>
      </div>
      <div>
        <p class="label-mono col-label">Contact</p>
        <ul class="link-list">
          <li><a href="mailto:online@fdsinstitut.com">online@fdsinstitut.com</a></li>
          <li><a href="https://www.fdsinstitut.com" target="_blank" rel="noopener noreferrer">fdsinstitut.com <span class="arrow-out">↗</span></a></li>
          <li><a href="https://moodle.fdsinstitut.online" target="_blank" rel="noopener noreferrer">Aperçu plateforme <span class="arrow-out">↗</span></a></li>
        </ul>
      </div>
    </div>
    <div class="bottom label-mono">
      <span class="copy">© 2026 FDS Institut · Tous droits réservés</span>
      <span class="secure"><span class="secure-dot"></span> Plateforme sécurisée</span>
    </div>
  </div>
</footer>
</body>
</html>
