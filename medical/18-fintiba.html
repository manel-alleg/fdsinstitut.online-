<style>
/* Hostinger isolation reset */
.fds-block{margin:0!important;padding:0!important;display:block;box-sizing:border-box}
.fds-block *{box-sizing:border-box}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
.fds-block{font-family:'Montserrat',sans-serif;overflow-x:hidden}
.fintiba-section{background:#f8fafc;border-top:2px solid #e2e8f0;padding:2rem 1.5rem}
.fintiba-inner{max-width:80rem;margin:0 auto;display:flex;align-items:center;gap:2rem;flex-wrap:wrap}
.fintiba-logo{width:120px;height:auto;display:block;flex-shrink:0}
.fintiba-text{flex:1;min-width:220px;font-family:'Nunito',sans-serif;font-weight:700;font-size:.95rem;color:#1e293b;line-height:1.55}
.fintiba-btn{display:inline-flex;align-items:center;gap:.4rem;font-family:'Montserrat',sans-serif;font-weight:700;font-size:.88rem;background:#FF7900;color:#fff;padding:.7rem 1.5rem;border-radius:10px;text-decoration:none;white-space:nowrap;transition:all .2s;flex-shrink:0}
.fintiba-btn:hover{background:#e56c00;transform:translateY(-1px);box-shadow:0 6px 18px rgba(255,121,0,.3)}
@media(max-width:640px){
  .fintiba-inner{flex-direction:column;text-align:center}
  .fintiba-logo{margin:0 auto}
  .fintiba-btn{width:100%;justify-content:center}
}
</style>

<div class="fds-block">
<section class="fintiba-section">
  <div class="fintiba-inner">
    <img src="https://assets.zyrosite.com/V9huRYqxhZWbrM0f/_fintiba-logo-colour-pfcy5JuSRtvMGJdi.png" alt="Fintiba" class="fintiba-logo"/>
    <p class="fintiba-text">Immigration to Germany? We partner with Fintiba — Germany's trusted blocked account provider.</p>
    <a href="https://partner.fintiba.com/FDS" target="_blank" rel="noopener" class="fintiba-btn">
      Open Fintiba Account &nbsp;→
    </a>
  </div>
</section>
</div>
