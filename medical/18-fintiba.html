<style>
.fds-block{margin:0!important;padding:0!important;display:block;box-sizing:border-box}
.fds-block *{box-sizing:border-box}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet"/>
<style>
:root{--orange:#FF7900;--blue:#00304E;--teal:#0891B2;--gray-200:#E2E3E5;--gray-500:#6B7280}
.fds-block{font-family:'Montserrat',sans-serif;overflow-x:hidden}
.fintiba-section{background:#fff;border-top:2px solid var(--gray-200);padding:2.5rem 1.5rem}
.fintiba-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:2.5rem;flex-wrap:wrap;justify-content:space-between}
.fintiba-left{display:flex;align-items:center;gap:1.5rem;flex:1;min-width:260px}
.fintiba-logo{height:36px;width:auto;display:block;flex-shrink:0}
.fintiba-divider{width:1.5px;height:36px;background:var(--gray-200);flex-shrink:0}
.fintiba-eyebrow{font-family:'Nunito',sans-serif;font-weight:800;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);display:block;margin-bottom:.2rem}
.fintiba-headline{font-family:'Sora',sans-serif;font-weight:700;font-size:1rem;color:var(--blue);line-height:1.25;margin-bottom:.2rem}
.fintiba-sub{font-family:'Montserrat',sans-serif;font-size:.8rem;color:var(--gray-500);line-height:1.5}
.fintiba-btn{display:inline-flex;align-items:center;gap:.45rem;font-family:'Montserrat',sans-serif;font-weight:700;font-size:.88rem;background:var(--blue);color:#fff;padding:.7rem 1.4rem;border-radius:10px;text-decoration:none;white-space:nowrap;transition:all .2s;flex-shrink:0}
.fintiba-btn:hover{background:#004d7a;transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,48,78,.3)}
@media(max-width:600px){
  .fintiba-inner{flex-direction:column;align-items:flex-start;gap:1.5rem}
  .fintiba-btn{width:100%;justify-content:center}
}
</style>
<div class="fds-block">
<section class="fintiba-section">
  <div class="fintiba-inner">
    <div class="fintiba-left">
      <img src="https://assets.zyrosite.com/V9huRYqxhZWbrM0f/_fintiba-logo-colour-pfcy5JuSRtvMGJdi.png" alt="Fintiba" class="fintiba-logo"/>
      <div class="fintiba-divider"></div>
      <div class="fintiba-text">
        <span class="fintiba-eyebrow">Official Partner</span>
        <div class="fintiba-headline">Relocating to Germany for your medical career?</div>
        <div class="fintiba-sub">Fintiba manages your blocked account for the Approbation &amp; visa process — trusted by healthcare professionals.</div>
      </div>
    </div>
    <a href="https://partner.fintiba.com/FDS" target="_blank" rel="noopener" class="fintiba-btn">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      Open Fintiba Account
    </a>
  </div>
</section>
</div>
