<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDS Institut — Footer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&family=Montserrat:wght@900&family=JetBrains+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{background:#030712;color:#fff;font-family:'Poppins',sans-serif}
a{color:inherit;text-decoration:none}
:root{--orange:#f97316;--ink:#15233c;--mint:#86efac}
::selection{background:var(--orange);color:var(--ink)}
.label-mono{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase}

footer{
  border-top:1px solid rgba(255,255,255,.05);
  padding:2.5rem 1.5rem;
}
@media(min-width:1024px){footer{padding:2.5rem 3rem}}
.footer-inner{
  max-width:80rem;
  margin:0 auto;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:1.25rem;
}
.copy{color:rgba(255,255,255,.3)}
.links{display:flex;flex-wrap:wrap;align-items:center;gap:1.25rem}
.links a{color:rgba(255,255,255,.3);transition:color .2s}
.links a:hover{color:var(--orange)}
.arrow-out{color:rgba(255,255,255,.2)}
</style>
</head>
<body>
<footer>
  <div class="footer-inner">
    <span class="label-mono copy">© 2026 FDS Institut · Deutsch, gemacht für dich.</span>
    <div class="links label-mono">
      <a href="mailto:online@fdsinstitut.com">online@fdsinstitut.com</a>
      <a href="https://www.fdsinstitut.com" target="_blank" rel="noopener noreferrer">
        fdsinstitut.com <span class="arrow-out">↗</span>
      </a>
    </div>
  </div>
</footer>
</body>
</html>
