<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FDS Institut — Footer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }

    :root {
      --orange: #FF7900;
      --blue: #00304E;
      --black: #111;
      --gray-50: #F7F8FA;
      --gray-200: #E2E3E5;
      --gray-500: #6B7280;
    }

    body {
      background: #fff;
      font-family: 'Nunito', sans-serif;
    }

    a { color: inherit; text-decoration: none; }

    footer {
      background: #fff;
      border-top: 1px solid var(--gray-200);
      padding: 2.5rem 1.5rem;
    }

    @media (min-width: 1024px) {
      footer { padding: 2.5rem 3rem; }
    }

    .footer-inner {
      max-width: 80rem;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .copy {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.6875rem;
      letter-spacing: 0.04em;
      color: var(--gray-500);
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.25rem;
    }

    .footer-links a {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.6875rem;
      letter-spacing: 0.04em;
      color: var(--gray-500);
      transition: color 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
    }

    .footer-links a:hover {
      color: var(--orange);
    }

    /* External link arrow icon */
    .ext-icon {
      display: inline-block;
      width: 10px;
      height: 10px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <footer>
    <div class="footer-inner">
      <span class="copy">&#169; 2026 FDS Institut &middot; Deutsch, gemacht f&uuml;r dich.</span>

      <div class="footer-links">
        <a href="mailto:online@fdsinstitut.com">online@fdsinstitut.com</a>
        <a href="https://www.fdsinstitut.com" target="_blank" rel="noopener noreferrer">
          fdsinstitut.com
          <!-- External link SVG -->
          <svg class="ext-icon" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M1 9L9 1M9 1H4M9 1v5"/>
          </svg>
        </a>
      </div>
    </div>
  </footer>
</body>
</html>
