<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FDS Institut — Why Two Doors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Montserrat:wght@400;500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }

    :root {
      --orange: #FF7900;
      --blue: #00304E;
      --black: #111;
      --gray-50: #F7F8FA;
      --gray-200: #E2E3E5;
      --gray-500: #6B7280;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #fff;
      color: var(--black);
    }

    /* ── Section ── */
    section {
      max-width: 80rem;
      margin: 0 auto;
      padding: 5rem 1.5rem;
    }

    @media (min-width: 1024px) {
      section { padding: 7rem 3rem; }
    }

    /* Section label */
    .section-label {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 1rem;
    }

    /* H2 */
    h2 {
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: clamp(2rem, 5vw, 3.25rem);
      letter-spacing: -0.03em;
      line-height: 1.0;
      color: var(--black);
      max-width: 36rem;
      margin-bottom: 4rem;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      gap: 1.5rem;
      grid-template-columns: 1fr;
    }

    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* ── Card ── */
    .card {
      position: relative;
      padding: 2rem;
      border: 1.5px solid var(--gray-200);
      border-radius: 20px;
      background: #fff;
      transition: border-color 0.25s ease,
                  box-shadow 0.25s ease;
    }

    .card:hover {
      border-color: var(--orange);
      box-shadow: 0 8px 32px -8px rgba(255, 121, 0, 0.12);
    }

    .card-num {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: var(--orange);
      margin-bottom: 1rem;
    }

    .card-title {
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: clamp(1.125rem, 2.5vw, 1.5rem);
      letter-spacing: -0.025em;
      color: var(--black);
      margin-bottom: 0.75rem;
    }

    .card-desc {
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: 0.9375rem;
      line-height: 1.7;
      color: var(--gray-500);
    }

    /* Animated underline */
    .card-line {
      margin-top: 1.5rem;
      height: 2px;
      width: 2rem;
      background: var(--orange);
      border-radius: 2px;
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .card:hover .card-line {
      width: 100%;
    }
  </style>
</head>
<body>
  <section>
    <p class="section-label">Why two doors</p>
    <h2>Same classroom.<br>Fairer pricing.</h2>

    <div class="grid">

      <div class="card">
        <div class="card-num">01</div>
        <h3 class="card-title">Live with humans</h3>
        <p class="card-desc">Real teachers, small groups, voices not bots.</p>
        <div class="card-line"></div>
      </div>

      <div class="card">
        <div class="card-num">02</div>
        <h3 class="card-title">Built for exams</h3>
        <p class="card-desc">Goethe &amp; TestDaF prep baked into every level.</p>
        <div class="card-line"></div>
      </div>

      <div class="card">
        <div class="card-num">03</div>
        <h3 class="card-title">Pay where you live</h3>
        <p class="card-desc">DA in Algeria, EUR everywhere else. No FX games.</p>
        <div class="card-line"></div>
      </div>

    </div>
  </section>
</body>
</html>
