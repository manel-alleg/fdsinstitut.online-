<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDS Institut — Why Two Doors</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Montserrat:wght@700;800;900&family=JetBrains+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{background:#030712;color:#fff;font-family:'Poppins',sans-serif}
h1,h2,h3{font-family:'Montserrat',sans-serif;letter-spacing:-.02em}
:root{--orange:#f97316;--ink:#15233c}
::selection{background:var(--orange);color:var(--ink)}
.label-mono{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase}

section{max-width:80rem;margin:0 auto;padding:5rem 1.5rem 7rem}
@media(min-width:1024px){section{padding:7rem 3rem}}

.eyebrow{color:var(--orange);margin-bottom:1rem}

h2{
  font-family:'Montserrat',sans-serif;
  font-weight:900;
  font-size:clamp(2.25rem,6vw,3.75rem);
  letter-spacing:-.03em;
  line-height:.95;
  color:#fff;
  max-width:36rem;
  margin-bottom:4rem;
}
h2 .muted{color:rgba(255,255,255,.3)}

.grid{
  display:grid;
  gap:2.5rem;
  grid-template-columns:1fr;
}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}

.card{position:relative}
.card-num{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--orange);margin-bottom:.75rem}
.card-title{
  font-family:'Montserrat',sans-serif;
  font-weight:900;
  font-size:clamp(1.25rem,3vw,1.875rem);
  letter-spacing:-.025em;
  color:#fff;
  margin-bottom:.75rem;
}
.card-desc{color:rgba(255,255,255,.55);line-height:1.7}
.card-line{
  margin-top:1.25rem;
  height:1px;
  width:3rem;
  background:rgba(255,255,255,.15);
  transition:width .5s ease, background .5s ease;
}
.card:hover .card-line{width:100%;background:var(--orange)}
</style>
</head>
<body>
<section>
  <p class="eyebrow label-mono">Why two doors</p>
  <h2>Same classroom.<br><span class="muted">Fairer pricing.</span></h2>
  <div class="grid">
    <div class="card">
      <div class="card-num">01</div>
      <h3 class="card-title">Live with humans</h3>
      <p class="card-desc">Real teachers, small groups, voices not bots.</p>
      <div class="card-line"></div>
    </div>
    <div class="card">
      <div class="card-num">02</div>
      <h3 class="card-title">Built for exams</h3>
      <p class="card-desc">Goethe & TestDaF prep baked into every level.</p>
      <div class="card-line"></div>
    </div>
    <div class="card">
      <div class="card-num">03</div>
      <h3 class="card-title">Pay where you live</h3>
      <p class="card-desc">DA in Algeria, EUR everywhere else. No FX games.</p>
      <div class="card-line"></div>
    </div>
  </div>
</section>
</body>
</html>
