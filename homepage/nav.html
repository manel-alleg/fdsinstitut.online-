<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDS Institut — Nav</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ─── */
:root {
  --orange: #FF7900;
  --orange-2: #FF9100;
  --blue: #00304E;
  --black: #111;
  --gray-50: #F7F8FA;
  --gray-100: #F0F1F3;
  --gray-200: #E2E3E5;
  --gray-500: #6B7280;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }
body { background: #fff; color: var(--black); font-family: 'Montserrat', sans-serif; overflow-x: hidden; line-height: 1.6; }
h1,h2,h3,h4 { font-family: 'Sora', sans-serif; letter-spacing: -.025em; }
a { color: inherit; text-decoration: none; }
button { cursor: pointer; font-family: inherit; border: none; background: none; }

/* ─── ANIMATIONS ─── */
@keyframes pulseDot { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.35; transform:scale(.85); } }

/* ─── BUTTONS ─── */
.btn { display:inline-flex; align-items:center; gap:.5rem; font-family:'Montserrat',sans-serif; font-weight:700; font-size:.9rem; border-radius:10px; padding:.75rem 1.5rem; transition:all .2s; cursor:pointer; border:2px solid transparent; white-space:nowrap; }
.btn-orange { background:var(--orange); color:#fff; border-color:var(--orange); }
.btn-orange:hover { background:var(--orange-2); border-color:var(--orange-2); transform:translateY(-1px); box-shadow:0 8px 20px -4px rgba(255,121,0,.4); }

/* ══════════════════════════════════
   1. URGENCY BAR
══════════════════════════════════ */
.urgency-bar {
  background:var(--orange); color:#fff; text-align:center;
  padding:.6rem 1.5rem; font-family:'Nunito',sans-serif; font-weight:700;
  font-size:.82rem; letter-spacing:.03em;
  display:flex; align-items:center; justify-content:center; gap:.6rem;
}
.pulse-dot {
  width:8px; height:8px; border-radius:50%; background:#fff;
  display:inline-block; flex-shrink:0; animation:pulseDot 1.4s ease infinite;
}

/* ══════════════════════════════════
   2. STICKY NAV
══════════════════════════════════ */
.nav {
  position:sticky; top:0; z-index:100;
  background:#fff; border-bottom:1px solid var(--gray-200);
  height:64px; display:flex; align-items:center;
}
.nav-inner {
  width:100%; max-width:80rem; margin:0 auto; padding:0 1.5rem;
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
}
.nav-brand  { display:flex; align-items:center; gap:.75rem; }
.nav-logo   { font-family:'Sora',sans-serif; font-weight:800; font-size:1.45rem; color:var(--blue); letter-spacing:-.04em; line-height:1; }
.nav-logo span { color:var(--orange); }
.nav-badge  { font-family:'Nunito',sans-serif; font-weight:800; font-size:.65rem; letter-spacing:.1em; text-transform:uppercase; background:var(--gray-100); color:var(--blue); padding:.25rem .6rem; border-radius:999px; }
.nav-actions { display:flex; align-items:center; gap:.75rem; }
.nav-link { font-family:'Montserrat',sans-serif; font-weight:600; font-size:.85rem; color:var(--blue); border:1.5px solid var(--gray-200); padding:.45rem .9rem; border-radius:8px; transition:all .2s; display:flex; align-items:center; gap:.35rem; cursor:pointer; }
.nav-link:hover { border-color:var(--orange); color:var(--orange); }

/* ─── RESPONSIVE ─── */
@media (max-width:1023px) {
  .nav-link { display:none; }
}
@media (max-width:600px) {
  .nav-badge { display:none; }
}
</style>
</head>
<body>

<!-- 1. URGENCY BAR -->
<div class="urgency-bar">
  <span class="pulse-dot"></span>
  New cohort starting Monday &nbsp;·&nbsp; Limited spots &nbsp;·&nbsp; Enroll in 2 minutes
</div>

<!-- 2. STICKY NAV -->
<nav class="nav">
  <div class="nav-inner">
    <div class="nav-brand">
      <div class="nav-logo">FDS<span>.</span></div>
      <div class="nav-badge">GLOBAL &nbsp;·&nbsp; A1–C2</div>
    </div>
    <div class="nav-actions">
      <a href="../dz/index.html" class="nav-link">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/></svg>
        DZ Algeria
      </a>
      <a href="../global/index.html" class="nav-link">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        International
      </a>
      <button class="btn btn-orange" onclick="scrollToHero()">Reserve</button>
    </div>
  </div>
</nav>

<script>
function scrollToHero() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
