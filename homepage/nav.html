<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDS Institut — Nav</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{background:#030712;color:#fff;font-family:'Poppins',sans-serif}
h1,h2,h3,h4,h5{font-family:'Montserrat',sans-serif;letter-spacing:-0.02em}
a{color:inherit;text-decoration:none}
:root{--orange:#f97316;--ink:#15233c;--paper:#fef9f4;--mint:#86efac;--teal:#14b8a6}
::selection{background:var(--orange);color:var(--ink)}
.label-mono{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase}

nav{
  position:relative;
  z-index:30;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.nav-inner{
  max-width:80rem;
  margin:0 auto;
  padding:1rem 1.5rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
@media(min-width:1024px){.nav-inner{padding:1rem 3rem}}
.logo{
  font-family:'Montserrat',sans-serif;
  font-weight:900;
  font-size:1.25rem;
  letter-spacing:-.04em;
  color:#fff;
}
.logo span.dot{color:var(--orange)}
.logo span.inst{
  color:rgba(255,255,255,.3);
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  letter-spacing:.18em;
  margin-left:.5rem;
  display:none;
}
@media(min-width:640px){.logo span.inst{display:inline}}
.nav-right{
  display:flex;
  align-items:center;
  gap:1.25rem;
}
.clock{color:rgba(255,255,255,.5)}
.live-dot{
  display:flex;
  align-items:center;
  gap:.375rem;
}
.dot-anim{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--mint);
  animation:pulse-ring 2s ease-out infinite;
}
@keyframes pulse-ring{
  0%{box-shadow:0 0 0 0 rgba(134,239,172,.6)}
  100%{box-shadow:0 0 0 12px transparent}
}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/" class="logo">FDS<span class="dot">.</span><span class="inst">INSTITUT</span></a>
    <div class="nav-right label-mono" style="color:rgba(255,255,255,.5)">
      <span class="clock" id="clock">—:—</span>
      <span class="live-dot">
        <span class="dot-anim"></span>
        Enrolling now
      </span>
    </div>
  </div>
</nav>
<script>
function tick(){
  document.getElementById('clock').textContent =
    'Berlin ' + new Date().toLocaleTimeString('en-GB',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit'});
}
tick();
setInterval(tick,30000);
</script>
</body>
</html>
