<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FDS Institut — Nav</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Montserrat:wght@400;500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }

    :root {
      --orange: #FF7900;
      --blue: #00304E;
      --black: #111;
      --gray-50: #F7F8FA;
      --gray-200: #E2E3E5;
      --gray-500: #6B7280;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #fff;
    }

    a { color: inherit; text-decoration: none; }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #fff;
      border-bottom: 1px solid var(--gray-200);
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 2rem;
      justify-content: space-between;
    }

    @media (min-width: 1024px) {
      nav { padding: 0 3rem; }
    }

    /* Logo */
    .nav-logo {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1px;
      line-height: 1;
    }

    .logo-fds {
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: 1.375rem;
      color: var(--black);
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .logo-fds .dot {
      color: var(--orange);
    }

    .logo-institut {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gray-500);
      line-height: 1;
    }

    @media (max-width: 480px) {
      .logo-institut { display: none; }
    }

    /* Right side */
    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .berlin-clock {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      color: var(--gray-500);
      letter-spacing: 0.04em;
    }

    @media (max-width: 480px) {
      .berlin-clock { display: none; }
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: 999px;
      padding: 0.3rem 0.8rem 0.3rem 0.6rem;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.7rem;
      color: var(--black);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .blink-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
      animation: blink 1.8s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="../index.html" class="nav-logo" aria-label="FDS Institut home">
      <span class="logo-fds">FDS<span class="dot">.</span></span>
      <span class="logo-institut">Institut</span>
    </a>

    <div class="nav-right">
      <span class="berlin-clock" id="berlinClock" aria-live="polite" aria-label="Berlin time">Berlin --:--</span>
      <div class="status-pill">
        <div class="blink-dot" aria-hidden="true"></div>
        Enrolling now
      </div>
    </div>
  </nav>

  <script>
    function updateClock() {
      const time = new Date().toLocaleTimeString('de-DE', {
        timeZone: 'Europe/Berlin',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });
      document.getElementById('berlinClock').textContent = 'Berlin ' + time;
    }
    updateClock();
    setInterval(updateClock, 30000);
  </script>
</body>
</html>
