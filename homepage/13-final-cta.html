<style>
/* Hostinger isolation reset — scopes this embed to zero out inherited spacing */
.fds-block{margin:0!important;padding:0!important;display:block;box-sizing:border-box}
.fds-block *{box-sizing:border-box}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root{--orange:#FF7900;--orange-2:#FF9100;--blue:#00304E;--black:#111;--gray-50:#F7F8FA;--gray-100:#F0F1F3;--gray-200:#E2E3E5;--gray-500:#6B7280;--moodle:#F27F22}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
.fds-block {scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
.fds-block {background:#fff;color:var(--black);font-family:'Montserrat',sans-serif;overflow-x:hidden;line-height:1.6}
h1,h2,h3,h4{font-family:'Sora',sans-serif;letter-spacing:-.025em}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;background:none}
img{max-width:100%;display:block}
input,textarea,select{font-family:'Montserrat',sans-serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
50%{transform:translateY(-14px) rotate(var(--r,0deg))}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.85)}}
@keyframes popIn{0%{transform:scale(.86);opacity:0}100%{transform:scale(1);opacity:1}}

/* cursor glow */

/* reveal */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
.reveal-d1.in{transition-delay:.1s}.reveal-d2.in{transition-delay:.2s}.reveal-d3.in{transition-delay:.3s}.reveal-d4.in{transition-delay:.4s}
.container{max-width:80rem;margin:0 auto;padding:0 1.5rem}
.container-sm{max-width:48rem;margin:0 auto;padding:0 1.5rem}
.accent{color:var(--orange)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:.5rem;font-family:'Montserrat',sans-serif;font-weight:700;font-size:.9rem;border-radius:10px;padding:.75rem 1.5rem;transition:all .2s;cursor:pointer;border:2px solid transparent;white-space:nowrap;text-decoration:none}
.btn-orange{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn-orange:hover{background:var(--orange-2);border-color:var(--orange-2);transform:translateY(-1px);box-shadow:0 8px 20px -4px rgba(255,121,0,.4)}
.btn-outline-white{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.btn-outline-white:hover{background:rgba(255,255,255,.1);border-color:#fff}
.btn-white-solid{background:#fff;color:var(--blue);font-weight:700;border-color:#fff}
.btn-white-solid:hover{background:var(--gray-50)}
.btn-moodle{background:var(--moodle);color:#fff;border-color:var(--moodle);padding:1rem 2.25rem;font-size:1rem}
.btn-moodle:hover{background:#d96e15;border-color:#d96e15;transform:translateY(-1px)}
.btn-lg{padding:1rem 2rem;font-size:1rem;border-radius:12px}
.btn-full{width:100%;justify-content:center}
.eyebrow{font-family:'Nunito',sans-serif;font-weight:800;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.eyebrow-orange{color:var(--orange)}
/* urgency bar */
.urgency-bar{background:var(--orange);color:#fff;text-align:center;padding:.6rem 1.5rem;font-family:'Nunito',sans-serif;font-weight:700;font-size:.82rem;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:.6rem}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:#fff;display:inline-block;flex-shrink:0;animation:pulseDot 1.4s ease infinite}
/* nav */
.nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--gray-200);height:64px;display:flex;align-items:center}
.nav-inner{width:100%;max-width:80rem;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.nav-brand{display:flex;align-items:center;gap:.75rem}
.nav-logo{font-family:'Sora',sans-serif;font-weight:800;font-size:1.45rem;color:var(--blue);letter-spacing:-.04em;line-height:1}
.nav-logo span{color:var(--orange)}
.nav-badge{font-family:'Nunito',sans-serif;font-weight:800;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;background:var(--gray-100);color:var(--blue);padding:.25rem .6rem;border-radius:999px}
.nav-actions{display:flex;align-items:center;gap:.75rem}
.nav-link{font-family:'Montserrat',sans-serif;font-weight:600;font-size:.85rem;color:var(--blue);border:1.5px solid var(--gray-200);padding:.45rem .9rem;border-radius:8px;transition:all .2s;display:flex;align-items:center;gap:.35rem}
.nav-link:hover{border-color:var(--orange);color:var(--orange)}
/* HERO */
#hero{position:relative;background:var(--blue);min-height:min(100vh,900px);display:flex;align-items:center;padding:5.5rem 1.5rem 7rem;overflow:hidden;scroll-margin-top:64px;text-align:center}

/* blobs */

/* floating photos */

.fp img{width:100%;height:100%;object-fit:cover;display:block}

/* hero center */
.hero-center{max-width:44rem;margin:0 auto;position:relative;z-index:4;width:100%}
.hero-eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-family:'Nunito',sans-serif;font-weight:800;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);border-radius:999px;padding:.4rem 1rem;margin-bottom:1.75rem}
.green-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;animation:pulseDot 1.4s ease infinite}
.hero-h1{font-size:clamp(3.5rem,10vw,7rem);font-weight:800;color:#fff;line-height:1;letter-spacing:-.04em;margin-bottom:1.25rem}
.hero-h1 .accent{color:var(--orange)}
.hero-sub{font-size:1.15rem;font-weight:500;color:rgba(255,255,255,.78);line-height:1.65;margin-bottom:2rem}
.trust-pills{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:2.5rem;justify-content:center}
.trust-pill{display:inline-flex;align-items:center;gap:.4rem;font-family:'Nunito',sans-serif;font-weight:700;font-size:.78rem;color:var(--black);background:#fff;border-radius:999px;padding:.35rem .9rem}
.trust-pill svg{color:var(--orange);flex-shrink:0}
/* form card */
.form-wrap{max-width:700px;margin:0 auto 2.5rem}
.form-card{background:#fff;border-radius:28px;box-shadow:0 50px 120px -20px rgba(0,0,0,.42),0 0 0 1px rgba(0,0,0,.04),0 20px 60px -30px rgba(255,121,0,.35);padding:3rem 3.25rem;animation:popIn .55s cubic-bezier(.175,.885,.32,1.275) both}
.form-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:.75rem}
.form-card-label{font-family:'Nunito',sans-serif;font-weight:800;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gray-500)}
.enroll-count{display:inline-flex;align-items:center;gap:.4rem;font-family:'Nunito',sans-serif;font-weight:700;font-size:.72rem;background:#f0fdf4;color:#15803d;border-radius:999px;padding:.25rem .7rem}
.form-dots{display:flex;gap:.35rem;margin-bottom:2rem}
.form-dot{height:7px;border-radius:999px;background:var(--gray-200);transition:all .35s ease;width:26px}
.form-dot.active{background:var(--orange);width:52px}
.form-dot.done{background:var(--orange);opacity:.4}
.form-step{display:none}
.form-step.active{display:block;animation:fadeUp .3s ease}
.step-label{font-family:'Nunito',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);margin-bottom:.5rem}
.step-question{font-family:'Sora',sans-serif;font-weight:800;font-size:1.28rem;color:var(--black);margin-bottom:1.25rem;line-height:1.2}
.loc-options{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.loc-card{border:2.5px solid var(--gray-200);border-radius:20px;padding:1.75rem 1.5rem;cursor:pointer;transition:all .22s ease;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.65rem;background:#fff}
.loc-card:hover{border-color:var(--orange);background:#fffaf5;transform:translateY(-3px);box-shadow:0 12px 30px -8px rgba(255,121,0,.3)}
.loc-card.selected{border-color:var(--orange);background:#fff7ef;box-shadow:0 0 0 5px rgba(255,121,0,.12)}
.loc-icon{width:60px;height:60px;border-radius:50%;background:var(--gray-100);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.loc-card.selected .loc-icon{background:rgba(255,121,0,.15)}
.dz-badge-circle{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-family:'Nunito',sans-serif;font-weight:800;font-size:.78rem;display:flex;align-items:center;justify-content:center}
.loc-title{font-family:'Sora',sans-serif;font-weight:700;font-size:1.05rem;color:var(--black)}
.loc-card.selected .loc-title{color:var(--orange)}
.loc-sub{font-family:'Nunito',sans-serif;font-weight:600;font-size:.72rem;color:var(--gray-500);line-height:1.4}
.loc-price{font-family:'Sora',sans-serif;font-weight:800;font-size:.92rem;color:var(--orange)}
.option-list{display:flex;flex-direction:column;gap:.6rem}
.opt-card{display:flex;align-items:center;gap:.875rem;padding:1rem 1.15rem;border:2px solid var(--gray-200);border-radius:14px;cursor:pointer;transition:all .2s;width:100%;text-align:left;font-family:'Montserrat',sans-serif;font-weight:600;font-size:.9rem;color:var(--black);background:#fff}
.opt-card:hover{border-color:var(--orange);background:#fffaf5;transform:translateX(3px)}
.opt-card.selected{border-color:var(--orange);background:#fff7ef;color:var(--orange);box-shadow:0 0 0 4px rgba(255,121,0,.1)}
.opt-icon{width:42px;height:42px;border-radius:11px;background:var(--gray-100);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--gray-500);transition:all .2s}
.opt-card.selected .opt-icon{background:rgba(255,121,0,.12);color:var(--orange)}
.opt-main{flex:1;display:flex;flex-direction:column;gap:.15rem}
.opt-title{font-weight:700;font-size:.95rem;line-height:1.2}
.opt-desc{font-family:'Nunito',sans-serif;font-weight:600;font-size:.72rem;color:var(--gray-500);line-height:1.3}
.opt-card.selected .opt-desc{color:rgba(255,121,0,.7)}
.opt-badge{font-family:'Nunito',sans-serif;font-weight:800;font-size:.72rem;background:var(--gray-100);color:var(--gray-500);padding:.3rem .7rem;border-radius:999px;white-space:nowrap;flex-shrink:0}
.opt-card.selected .opt-badge{background:#ffead6;color:var(--orange)}
.level-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.level-card{border:2px solid var(--gray-200);border-radius:14px;padding:1.1rem 1rem;cursor:pointer;transition:all .2s;text-align:center;background:#fff;display:flex;flex-direction:column;align-items:center;gap:.35rem}
.level-card:hover{border-color:var(--orange);background:#fffaf5;transform:translateY(-3px);box-shadow:0 8px 20px -6px rgba(255,121,0,.2)}
.level-card.selected{border-color:var(--orange);background:#fff7ef;box-shadow:0 0 0 4px rgba(255,121,0,.12)}
.level-code{font-family:'Sora',sans-serif;font-weight:800;font-size:1.25rem;color:var(--black)}
.level-card.selected .level-code{color:var(--orange)}
.level-name{font-family:'Nunito',sans-serif;font-weight:700;font-size:.68rem;color:var(--gray-500);text-transform:uppercase;letter-spacing:.05em}
.form-back{background:none;border:none;font-family:'Montserrat',sans-serif;font-weight:600;font-size:.8rem;color:var(--gray-500);cursor:pointer;margin-top:1rem;display:flex;align-items:center;gap:.3rem;padding:0;transition:color .2s}
.form-back:hover{color:var(--black)}
.form-field-group{display:flex;flex-direction:column;gap:.7rem;margin-bottom:1rem}
.form-input{width:100%;border:2px solid var(--gray-200);border-radius:12px;padding:1rem 1.15rem;font-family:'Montserrat',sans-serif;font-size:.93rem;font-weight:500;color:var(--black);outline:none;transition:border-color .2s,box-shadow .2s;background:#fff}
.form-input:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,121,0,.1)}
.form-input::placeholder{color:var(--gray-500)}
.form-note{font-family:'Nunito',sans-serif;font-weight:600;font-size:.73rem;color:var(--gray-500);text-align:center;margin-top:.5rem}
.form-success{display:none;text-align:center;padding:1.5rem 0}
.success-circle{width:80px;height:80px;border-radius:50%;background:#f0fdf4;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem}
.success-title{font-family:'Sora',sans-serif;font-weight:800;font-size:1.75rem;color:var(--black);margin-bottom:.5rem}
.success-sub{font-size:.95rem;color:var(--gray-500);margin-bottom:.75rem;line-height:1.6}
.success-help{font-size:.8rem;color:var(--gray-500)}
.success-help a{color:var(--orange);font-weight:600}
/* hero photo strip */
.hero-social{margin-top:2.25rem;display:flex;flex-direction:column;align-items:center;gap:1rem}
.hero-photos{display:flex;justify-content:center}
.hero-photo-card{width:66px;height:66px;border-radius:18px;overflow:hidden;border:3px solid rgba(255,255,255,.3);margin-left:-14px;box-shadow:0 4px 16px rgba(0,0,0,.3);transition:transform .25s}
.hero-photo-card:first-child{margin-left:0}
.hero-photo-card:hover{transform:translateY(-6px) scale(1.12);z-index:1}
.hero-photo-card img{width:100%;height:100%;object-fit:cover}
.social-proof{display:flex;align-items:center;gap:.75rem}
.avatar-stack{display:flex}
.avatar-item{width:36px;height:36px;border-radius:50%;background:var(--orange);color:#fff;font-family:'Sora',sans-serif;font-weight:700;font-size:.7rem;display:flex;align-items:center;justify-content:center;border:2px solid var(--blue);margin-left:-8px;flex-shrink:0}
.avatar-item:first-child{margin-left:0}
.social-text{font-family:'Nunito',sans-serif;font-weight:700;font-size:.82rem;color:rgba(255,255,255,.7);line-height:1.4}
.social-text strong{color:#fff}
/* stats */
.stats-bar{background:var(--orange);padding:3.5rem 1.5rem}
.stats-grid{max-width:80rem;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2rem}
.stat-item{text-align:center}
.stat-number{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(2rem,4vw,3rem);color:#fff;line-height:1;margin-bottom:.4rem}
.stat-label{font-family:'Nunito',sans-serif;font-weight:700;font-size:.8rem;color:rgba(255,255,255,.7);letter-spacing:.05em;text-transform:uppercase}
/* image section */
.image-section{position:relative;min-height:480px;display:flex;align-items:center;overflow:hidden}
.image-bg{position:absolute;inset:0;z-index:0;background-image:url('https://images.pexels.com/photos/4144923/pexels-photo-4144923.jpeg?auto=compress&cs=tinysrgb&w=1400');background-size:cover;background-position:center}
.image-overlay{position:absolute;inset:0;z-index:1;background:rgba(0,48,78,.8)}
.image-content{position:relative;z-index:2;max-width:80rem;margin:0 auto;padding:5rem 1.5rem;width:100%}
.image-content-inner{max-width:540px}
.image-eyebrow-line{display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem}
.orange-line{width:32px;height:3px;background:var(--orange);border-radius:2px}
.image-eyebrow-text{font-family:'Nunito',sans-serif;font-weight:800;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.image-h2{font-size:clamp(1.75rem,4vw,3rem);font-weight:800;color:#fff;line-height:1.1;margin-bottom:1rem}
.image-sub{font-size:.95rem;color:rgba(255,255,255,.8);line-height:1.65;margin-bottom:2rem;max-width:38ch}
/* video */
.video-section{padding:5rem 1.5rem;background:var(--gray-50)}
.video-inner{max-width:64rem;margin:0 auto}
.section-eyebrow{font-family:'Nunito',sans-serif;font-weight:800;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);display:block;margin-bottom:.75rem}
.section-title{font-size:clamp(1.6rem,3vw,2.25rem);font-weight:800;color:var(--black);line-height:1.15}
.video-card{border-radius:20px;overflow:hidden;box-shadow:0 32px 80px -16px rgba(0,0,0,.18)}
.video-thumb{position:relative;cursor:pointer;aspect-ratio:16/9;overflow:hidden}
.video-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.video-thumb:hover img{transform:scale(1.03)}
.video-overlay{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;background:var(--orange);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(255,121,0,.55);transition:transform .25s,box-shadow .25s;padding-left:5px}
.video-thumb:hover .play-btn{transform:translate(-50%,-50%) scale(1.12)}
.video-caption{position:absolute;bottom:1.25rem;left:1.25rem;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);color:#fff;border-radius:999px;padding:.4rem 1rem;font-family:'Nunito',sans-serif;font-weight:700;font-size:.75rem;display:flex;align-items:center;gap:.5rem}
.video-cap-dot{width:7px;height:7px;border-radius:50%;background:#EF4444;animation:pulseDot 1.4s ease infinite}
/* features */
.features-section{background:#fff;padding:6rem 1.5rem}
.section-header{text-align:center;margin-bottom:3.5rem}
.section-h2{font-size:clamp(1.6rem,3vw,2.25rem);font-weight:800;color:var(--black);line-height:1.15;margin-top:.5rem}
.section-sub{font-size:1rem;color:var(--gray-500);margin-top:.75rem;line-height:1.6;max-width:44ch;margin-left:auto;margin-right:auto}
.portals-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:3.5rem}
.portal-card{border-radius:24px;padding:2.5rem 2rem;display:flex;flex-direction:column;position:relative;overflow:hidden}
.portal-card.dz{background:var(--orange);color:#fff}
.portal-card.intl{background:#fff;border:2px solid var(--gray-200)}
.portal-badge{display:inline-flex;font-family:'Nunito',sans-serif;font-weight:800;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;padding:.3rem .75rem;border-radius:999px;margin-bottom:1.25rem;width:fit-content}
.portal-card.dz .portal-badge{background:rgba(0,0,0,.2);color:#fff}
.portal-card.intl .portal-badge{background:var(--blue);color:#fff}
.portal-card h3{font-size:1.5rem;font-weight:800;margin-bottom:.5rem;line-height:1.15}
.portal-card.dz h3{color:#fff}
.portal-card.intl h3{color:var(--blue)}
.portal-price{font-family:'Sora',sans-serif;font-weight:800;font-size:1.25rem;margin-bottom:1.25rem}
.portal-card.dz .portal-price{color:rgba(255,255,255,.9)}
.portal-card.intl .portal-price{color:var(--orange)}
.portal-features{list-style:none;display:flex;flex-direction:column;gap:.55rem;margin-bottom:1.75rem;flex:1}
.portal-features li{display:flex;align-items:center;gap:.5rem;font-family:'Montserrat',sans-serif;font-weight:600;font-size:.88rem}
.portal-card.dz .portal-features li{color:rgba(255,255,255,.9)}
.portal-card.intl .portal-features li{color:var(--black)}
.portal-card.dz .portal-features li svg{color:rgba(255,255,255,.8)}
.portal-card.intl .portal-features li svg{color:#22c55e}
.portal-cta-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:1rem 2rem;font-family:'Montserrat',sans-serif;font-weight:700;font-size:1rem;border-radius:12px;cursor:pointer;transition:all .2s;border:none;margin-bottom:.75rem}
.portal-card.dz .portal-cta-btn{background:rgba(0,0,0,.2);color:#fff}
.portal-card.dz .portal-cta-btn:hover{background:rgba(0,0,0,.35);transform:translateY(-1px)}
.portal-card.intl .portal-cta-btn{background:var(--orange);color:#fff}
.portal-card.intl .portal-cta-btn:hover{background:var(--orange-2);transform:translateY(-1px);box-shadow:0 8px 20px -4px rgba(255,121,0,.4)}
.portal-link{font-family:'Montserrat',sans-serif;font-weight:600;font-size:.82rem;display:block;text-align:center}
.portal-card.dz .portal-link{color:rgba(255,255,255,.75)}
.portal-card.dz .portal-link:hover{color:#fff}
.portal-card.intl .portal-link{color:var(--gray-500)}
.portal-card.intl .portal-link:hover{color:var(--orange)}
.portal-deco{position:absolute;bottom:-40px;right:-40px;width:160px;height:160px;border-radius:50%;border:3px solid rgba(255,255,255,.15);pointer-events:none}
.mini-features{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem}
.mini-feat{padding:1.75rem 1.5rem;border:2px solid var(--gray-200);border-radius:20px;transition:all .25s}

<div class="fds-block">
<!-- 12. FINAL CTA -->
<section class="final-cta">
  <div class="final-cta-inner">
    <h2 class="final-cta-h2 reveal">Ready to speak <span class="accent">German?</span></h2>
    <p class="final-cta-sub reveal reveal-d1">Join 12 000+ students learning German the right way — live, online, with real teachers.</p>
    <div class="final-cta-btns reveal reveal-d2">
      <button class="btn btn-orange btn-lg" onclick="scrollToHero()">Reserve my seat</button>
      <a class="btn btn-outline-white btn-lg" href="https://elearning.fdsinstitut.com" target="_blank" rel="noopener">Visit the platform &rarr;</a>
    </div>
  </div>
</section>
<script>
/* FORM *//* FORM */
let curStep=1; const ans={};
function scrollToHero(){ document.getElementById('hero').scrollIntoView({behavior:'smooth'}); }
function goStep(n){
  document.querySelectorAll('.form-step').forEach(s=>s.classList.remove('active'));
  const t=document.querySelector(`.form-step[data-step="${n}"]`);
  if(t){ t.classList.add('active'); curStep=n; updateDots(n); }
}
function updateDots(n){
  document.querySelectorAll('.form-dot').forEach((d,i)=>{ d.classList.remove('active','done'); if(i+1<n)d.classList.add('done'); else if(i+1===n)d.classList.add('active'); });
}
function goBack(){ if(curStep>1)goStep(curStep-1); }
function selectLocation(el,val){
  document.querySelectorAll('.loc-card').forEach(c=>c.classList.remove('selected')); el.classList.add('selected'); ans.location=val;
  const p=val==='dz'?['7 500 DA/mo','4 900 DA/mo','12 000 DA/mo']:['€125/mo','€85/mo','€290/mo'];
  document.querySelectorAll('.price-badge').forEach((b,i)=>{ if(p[i])b.textContent=p[i]; });
  setTimeout(()=>goStep(2),320);
}
function selectOpt(el,key,val){
  el.closest('.option-list').querySelectorAll('.opt-card').forEach(c=>c.classList.remove('selected')); el.classList.add('selected'); ans[key]=val;
  setTimeout(()=>goStep(curStep+1),320);
}
function selectLevel(el,val){
  document.querySelectorAll('.level-card').forEach(c=>c.classList.remove('selected')); el.classList.add('selected'); ans.level=val;
  setTimeout(()=>{ goStep(4); syncFields(); },320);
}
function syncFields(){
  document.querySelectorAll('.loc-dz').forEach(f=>f.style.display=ans.location==='dz'?'block':'none');
  document.querySelectorAll('.loc-intl').forEach(f=>f.style.display=ans.location==='intl'?'block':'none');
}
const _gs=goStep; window.goStep=function(n){ _gs(n); if(n===5)syncFields(); };
function startDZ(){ ans.location='dz'; scrollToHero(); setTimeout(()=>goStep(2),500); }
function startIntl(){ ans.location='intl'; scrollToHero(); setTimeout(()=>goStep(2),500); }
function submitForm(e){
  e.preventDefault();
  document.querySelector('.form-steps-wrap').style.display='none';
  document.querySelector('.form-success').style.display='block';
  const b=document.getElementById('success-banner'); b.classList.add('show'); setTimeout(()=>b.classList.remove('show'),6000);
}

/* VIDEO */
function loadVideo(){ document.getElementById('video-thumb').style.display='none'; document.getElementById('video-frame').style.display='block'; document.getElementById('yt-frame').src='https://www.youtube.com/embed/?autoplay=1&rel=0'; }

/* FAQ */
document.querySelectorAll('.faq-q').forEach(q=>{
  q.addEventListener('click',()=>{ const item=q.closest('.faq-item'),isOpen=item.classList.contains('open'); document.querySelectorAll('.faq-item').forEach(i=>i.classList.remove('open')); if(!isOpen)item.classList.add('open'); });
  q.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); q.click(); } });
});

/* REVEAL */
const obs=new IntersectionObserver(entries=>{ entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); obs.unobserve(e.target); } }); },{threshold:0.1});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));

/* COUNTERS */
function animCounter(el){
  if(el.dataset.static){ el.textContent=el.dataset.static; return; }
  const target=parseInt(el.dataset.count)||0,suffix=el.dataset.suffix||'',dur=1800,t0=performance.now();
  function step(now){ const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,3),v=Math.floor(e*target); el.textContent=v>=1000?Math.floor(v/1000)+' '+String(v%1000||'000').padStart(3,'0')+suffix:v+suffix; if(p<1)requestAnimationFrame(step); else el.textContent=target>=1000?Math.floor(target/1000)+' '+String(target%1000||'000').padStart(3,'0')+suffix:target+suffix; }
  requestAnimationFrame(step);
}
const cObs=new IntersectionObserver(entries=>{ entries.forEach(e=>{ if(e.isIntersecting){ animCounter(e.target); cObs.unobserve(e.target); } }); },{threshold:0.5});
document.querySelectorAll('.stat-number').forEach(el=>cObs.observe(el));

document.querySelectorAll('.loc-card,.level-card').forEach(c=>{ c.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); c.click(); } }); });
</script>
