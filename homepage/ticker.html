<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FDS Institut — Ticker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }

    :root {
      --orange: #FF7900;
      --gray-200: #E2E3E5;
      --gray-500: #6B7280;
    }

    body {
      background: #fff;
      overflow: hidden;
    }

    .ticker-wrap {
      border-top: 1px solid var(--gray-200);
      border-bottom: 1px solid var(--gray-200);
      padding: 1rem 0;
      overflow: hidden;
      background: #fff;
    }

    .marquee {
      display: flex;
      gap: 0;
      width: max-content;
      animation: marquee 32s linear infinite;
      will-change: transform;
    }

    @keyframes marquee {
      to { transform: translateX(-50%); }
    }

    .marquee-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: 0.8125rem;
      letter-spacing: 0.04em;
      color: var(--gray-500);
      white-space: nowrap;
      padding: 0 1rem;
    }

    /* SVG diamond separator */
    .diamond-sep {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }

    .diamond-sep svg {
      width: 7px;
      height: 7px;
    }
  </style>
</head>
<body>
  <div class="ticker-wrap" role="marquee" aria-label="FDS Institut highlights">
    <div class="marquee" id="marquee"></div>
  </div>

  <script>
    const words = [
      'Deutsch lernen',
      'A1 → C2',
      'Live online',
      'TestDaF ready',
      'Goethe Zertifikat',
      'FDS Institut'
    ];

    // Repeat 6x so -50% translateX creates a seamless loop
    const all = [...words, ...words, ...words, ...words, ...words, ...words];
    const m = document.getElementById('marquee');

    const diamondSVG = '<svg viewBox="0 0 8 8" fill="#FF7900" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><polygon points="4,0 8,4 4,8 0,4"/></svg>';

    all.forEach(function (word) {
      const span = document.createElement('span');
      span.className = 'marquee-item';
      span.innerHTML = word + '<span class="diamond-sep">' + diamondSVG + '</span>';
      m.appendChild(span);
    });
  </script>
</body>
</html>
