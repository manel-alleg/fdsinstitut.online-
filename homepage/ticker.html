<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FDS Institut — Ticker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }

    :root {
      --orange: #FF7900;
      --gray-200: #E2E3E5;
      --gray-500: #6B7280;
      --black: #111;
    }

    body {
      background: #fff;
      overflow: hidden;
    }

    .ticker-wrap {
      border-top: 1px solid var(--gray-200);
      border-bottom: 1px solid var(--gray-200);
      background: #fff;
      padding: 14px 0;
      overflow: hidden;
    }

    .marquee {
      display: flex;
      width: max-content;
      animation: marquee 34s linear infinite;
      will-change: transform;
    }

    @keyframes marquee {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    .marquee-item {
      display: inline-flex;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: 0.875rem;
      letter-spacing: 0.02em;
      color: var(--black);
      white-space: nowrap;
      padding: 0 0.75rem;
    }

    .diamond-sep {
      display: inline-flex;
      align-items: center;
      margin: 0 0.75rem;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="ticker-wrap" role="marquee" aria-label="FDS Institut highlights">
    <div class="marquee" id="marquee"></div>
  </div>

  <script>
    const words = [
      'Sprich Deutsch',
      'A1 → C2',
      'Live online',
      'TestDaF ready',
      'Goethe Zertifikat',
      'FDS Institut',
      '12 000+ étudiants',
      'Depuis Alger'
    ];

    const diamondSVG = '<svg width="7" height="7" viewBox="0 0 8 8" fill="#FF7900" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><polygon points="4,0 8,4 4,8 0,4"/></svg>';

    // Double the set so translateX(-50%) creates a seamless loop
    const full = [...words, ...words, ...words, ...words, ...words, ...words];
    const m = document.getElementById('marquee');

    full.forEach(function(word) {
      const span = document.createElement('span');
      span.className = 'marquee-item';
      span.innerHTML = word + '<span class="diamond-sep">' + diamondSVG + '</span>';
      m.appendChild(span);
    });
  </script>
</body>
</html>
