<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Footer — FDS Institut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Montserrat:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --orange: #FF7900;
    --blue: #00304E;
    --gray-200: #E2E3E5;
    --gray-500: #6B7280;
    --black: #111111;
  }
  body { font-family: 'Montserrat', sans-serif; background: #fff; color: var(--black); }
  footer {
    border-top: 1px solid var(--gray-200);
    max-width: 80rem; margin: 0 auto; padding: 3.5rem 1.5rem 2rem;
  }
  .grid {
    display: grid; gap: 2.5rem; grid-template-columns: 1fr;
    margin-bottom: 2.5rem;
  }
  @media (min-width: 768px) { .grid { grid-template-columns: 2fr 1fr 1fr; } }
  .logo {
    font-family: 'Sora', sans-serif; font-weight: 700; font-size: 1.5rem;
    color: var(--blue); letter-spacing: -0.03em; text-decoration: none; display: inline-block; margin-bottom: 0.5rem;
  }
  .logo .dot { color: var(--orange); }
  .tagline { font-size: 0.875rem; color: var(--gray-500); margin-bottom: 0.5rem; }
  .copyright { font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.75rem; color: var(--gray-500); }
  .col-heading {
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.6875rem;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray-500); margin-bottom: 1rem;
  }
  .nav-links { display: flex; flex-direction: column; gap: 0.5rem; }
  .nav-links a {
    font-size: 0.9rem; color: var(--gray-500); text-decoration: none;
    transition: color 0.15s;
  }
  .nav-links a:hover { color: var(--orange); }
  .contact-link {
    display: inline-flex; align-items: center; gap: 0.3rem;
    font-size: 0.9rem; color: var(--gray-500); text-decoration: none; transition: color 0.15s; margin-bottom: 0.5rem;
  }
  .contact-link:hover { color: var(--orange); }
  .bottom {
    border-top: 1px solid var(--gray-200); padding-top: 1.5rem;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.6875rem;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--gray-500); text-align: center;
  }
</style>
</head>
<body>
  <footer>
    <div class="grid">
      <div>
        <a href="/" class="logo">FDS<span class="dot">.</span></a>
        <p class="tagline">Online German school. Est. Algiers.</p>
        <p class="copyright">&copy; 2026 FDS Institut</p>
      </div>
      <div>
        <p class="col-heading">Navigation</p>
        <div class="nav-links">
          <a href="#pricing">Pricing</a>
          <a href="https://elearning.fdsinstitut.com" target="_blank" rel="noopener">Platform</a>
          <a href="#faq">FAQ</a>
          <a href="#" onclick="openModal();return false;">Trial Class</a>
        </div>
      </div>
      <div>
        <p class="col-heading">Contact</p>
        <a class="contact-link" href="mailto:online@fdsinstitut.com">online@fdsinstitut.com</a><br>
        <a class="contact-link" href="https://fdsinstitut.com" target="_blank" rel="noopener">
          fdsinstitut.com
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
    </div>
    <div class="bottom">All sessions conducted online &nbsp;&middot;&nbsp; Globally accessible</div>
  </footer>
  <script>
    function openModal() {
      window.parent && window.parent.openModal ? window.parent.openModal() : alert('Modal coming soon.');
    }
  </script>
</body>
</html>
