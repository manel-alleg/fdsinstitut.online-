<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FDS Institut — Footer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Montserrat:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }

    :root {
      --orange: #FF7900;
      --blue: #00304E;
      --gray-50: #F7F8FA;
      --gray-200: #E2E3E5;
      --gray-500: #6B7280;
      --black: #111;
    }

    body {
      background: #fff;
      font-family: 'Montserrat', sans-serif;
      color: var(--black);
    }

    .footer {
      background: #fff;
      border-top: 1px solid var(--gray-200);
      padding: 3.5rem 1.5rem 0;
    }

    .footer-inner {
      max-width: 80rem;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 3rem;
      padding-bottom: 3rem;
    }

    .footer-brand-logo {
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: 1.35rem;
      color: var(--blue);
      letter-spacing: -.04em;
      margin-bottom: .5rem;
    }

    .footer-brand-logo span {
      color: var(--orange);
    }

    .footer-brand-sub {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: .78rem;
      color: var(--gray-500);
      margin-bottom: .35rem;
    }

    .footer-copy {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: .72rem;
      color: var(--gray-500);
      margin-top: .75rem;
    }

    .footer-nav-title,
    .footer-contact-title {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: .72rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--black);
      margin-bottom: 1rem;
    }

    .footer-links {
      display: flex;
      flex-direction: column;
      gap: .55rem;
    }

    .footer-link {
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: .85rem;
      color: var(--gray-500);
      cursor: pointer;
      transition: color .2s;
      text-decoration: none;
      background: none;
      border: none;
      padding: 0;
      text-align: left;
    }

    .footer-link:hover {
      color: var(--orange);
    }

    .footer-contact-items {
      display: flex;
      flex-direction: column;
      gap: .6rem;
    }

    .footer-contact-item {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: .85rem;
      color: var(--gray-500);
    }

    .footer-contact-item a {
      color: var(--gray-500);
      transition: color .2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: .25rem;
    }

    .footer-contact-item a:hover {
      color: var(--orange);
    }

    .footer-bottom {
      border-top: 1px solid var(--gray-200);
      padding: 1rem 1.5rem;
      max-width: 80rem;
      margin: 0 auto;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: .72rem;
      color: var(--gray-500);
      text-align: center;
    }

    @media (max-width: 1023px) {
      .footer-inner {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
    }

    @media (max-width: 600px) {
      .footer { padding: 2.5rem 1rem 0; }
    }
  </style>
</head>
<body>

<footer class="footer" role="contentinfo">
  <div class="footer-inner">

    <!-- Brand column -->
    <div>
      <div class="footer-brand-logo">FDS<span>.</span></div>
      <div class="footer-brand-sub">Online German school. Est. Algiers.</div>
      <div class="footer-copy">&copy; 2026 FDS Institut. All rights reserved.</div>
    </div>

    <!-- Navigation column -->
    <div>
      <div class="footer-nav-title">Navigation</div>
      <nav class="footer-links" aria-label="Footer navigation">
        <a class="footer-link" href="#pricing">Pricing</a>
        <a class="footer-link" href="https://elearning.fdsinstitut.com" target="_blank" rel="noopener">Platform</a>
        <a class="footer-link" href="#faq">FAQ</a>
        <a class="footer-link" href="#hero">Trial Class</a>
      </nav>
    </div>

    <!-- Contact column -->
    <div>
      <div class="footer-contact-title">Contact</div>
      <div class="footer-contact-items">

        <div class="footer-contact-item">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <a href="mailto:online@fdsinstitut.com">online@fdsinstitut.com</a>
        </div>

        <div class="footer-contact-item">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <a href="https://fdsinstitut.com" target="_blank" rel="noopener">
            fdsinstitut.com
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
              <polyline points="15 3 21 3 21 9"/>
              <line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
          </a>
        </div>

      </div>
    </div>

  </div>
  <div class="footer-bottom">All sessions conducted online &nbsp;&middot;&nbsp; Globally accessible</div>
</footer>

</body>
</html>
