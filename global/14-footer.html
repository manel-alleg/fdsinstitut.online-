<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDS Institut — Footer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #FF7900;
  --orange-2: #FF9100;
  --blue: #00304E;
  --black: #111;
  --gray-50: #F7F8FA;
  --gray-200: #E2E3E5;
  --gray-500: #6B7280;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }
body { background: #fff; color: var(--black); font-family: 'Montserrat', sans-serif; }
h1,h2,h3,h4 { font-family: 'Sora', sans-serif; letter-spacing: -.025em; }
a { color: inherit; text-decoration: none; }

.footer {
  background: #fff;
  border-top: 1px solid var(--gray-200);
  padding: 3.5rem 1.5rem 0;
}
.footer-inner {
  max-width: 80rem;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 3rem;
  padding-bottom: 3rem;
}

/* Brand column */
.footer-brand-logo {
  font-family: 'Sora', sans-serif;
  font-weight: 800;
  font-size: 1.35rem;
  color: var(--blue);
  letter-spacing: -.04em;
  margin-bottom: .5rem;
  line-height: 1;
}
.footer-brand-logo span { color: var(--orange); }
.footer-brand-sub {
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: .78rem;
  color: var(--gray-500);
  margin-bottom: .35rem;
}
.footer-copy {
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: .72rem;
  color: var(--gray-500);
  margin-top: .75rem;
}

/* Nav / Contact column headings */
.footer-col-title {
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: .72rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--black);
  margin-bottom: 1rem;
}

/* Nav links */
.footer-links { display: flex; flex-direction: column; gap: .55rem; }
.footer-link {
  font-family: 'Montserrat', sans-serif;
  font-weight: 500;
  font-size: .85rem;
  color: var(--gray-500);
  cursor: pointer;
  transition: color .2s;
  background: none;
  border: none;
  padding: 0;
  text-align: left;
  display: inline;
}
.footer-link:hover { color: var(--orange); }
.footer-link:focus-visible {
  outline: 2px solid var(--orange);
  outline-offset: 2px;
  border-radius: 2px;
}

/* Contact items */
.footer-contact-items { display: flex; flex-direction: column; gap: .6rem; }
.footer-contact-item {
  display: flex;
  align-items: center;
  gap: .5rem;
  font-family: 'Montserrat', sans-serif;
  font-weight: 500;
  font-size: .85rem;
  color: var(--gray-500);
}
.footer-contact-item a {
  color: var(--gray-500);
  transition: color .2s;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.footer-contact-item a:hover { color: var(--orange); }

/* Bottom bar */
.footer-bottom {
  border-top: 1px solid var(--gray-200);
  padding: 1.25rem 1.5rem;
  max-width: 80rem;
  margin: 0 auto;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: .72rem;
  color: var(--gray-500);
  text-align: center;
}

@media (max-width: 768px) {
  .footer-inner {
    grid-template-columns: 1fr;
    gap: 2rem;
  }
}
</style>
</head>
<body>

<footer class="footer" role="contentinfo">
  <div class="footer-inner">

    <!-- Brand column -->
    <div>
      <div class="footer-brand-logo">FDS<span>.</span></div>
      <div class="footer-brand-sub">Online German school. Est. Algiers.</div>
      <div class="footer-copy">&copy; 2026 FDS Institut. All rights reserved.</div>
    </div>

    <!-- Navigation column -->
    <div>
      <div class="footer-col-title">Navigation</div>
      <div class="footer-links">
        <button
          class="footer-link"
          onclick="window.parent && window.parent.scrollToHero ? window.parent.scrollToHero() : window.scrollTo({top:0})"
          aria-label="Go to pricing">
          Pricing
        </button>
        <a
          class="footer-link"
          href="https://elearning.fdsinstitut.com"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit the learning platform (opens in new tab)">
          Platform
        </a>
        <button
          class="footer-link"
          onclick="window.parent && window.parent.scrollToHero ? window.parent.scrollToHero() : window.scrollTo({top:0})"
          aria-label="Go to FAQ">
          FAQ
        </button>
        <button
          class="footer-link"
          onclick="window.parent && window.parent.scrollToHero ? window.parent.scrollToHero() : window.scrollTo({top:0})"
          aria-label="Book a free trial class">
          Trial Class
        </button>
      </div>
    </div>

    <!-- Contact column -->
    <div>
      <div class="footer-col-title">Contact</div>
      <div class="footer-contact-items">

        <div class="footer-contact-item">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <a href="mailto:online@fdsinstitut.com">online@fdsinstitut.com</a>
        </div>

        <div class="footer-contact-item">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <a href="https://fdsinstitut.com" target="_blank" rel="noopener noreferrer" aria-label="Visit fdsinstitut.com (opens in new tab)">
            fdsinstitut.com
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
              <polyline points="15 3 21 3 21 9"/>
              <line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
          </a>
        </div>

      </div>
    </div>

  </div>

  <div class="footer-bottom">
    All sessions conducted online &nbsp;&middot;&nbsp; Globally accessible
  </div>
</footer>

</body>
</html>
