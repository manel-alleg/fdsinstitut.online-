<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FDS Institut — Platform Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Montserrat:wght@400;500&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }

    :root {
      --orange: #FF7900;
      --blue: #00304E;
      --gray-50: #F7F8FA;
      --gray-200: #E2E3E5;
      --gray-500: #6B7280;
      --black: #111;
    }

    body {
      background: #fff;
      font-family: 'Montserrat', sans-serif;
    }

    .moodle-section {
      background: var(--gray-50);
      border-top: 1px solid var(--gray-200);
      border-bottom: 1px solid var(--gray-200);
      padding: 64px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .moodle-logo {
      height: 36px;
      width: auto;
      display: block;
      margin-bottom: 24px;
    }

    h2 {
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      color: var(--black);
      margin-bottom: 10px;
    }

    .desc {
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
      color: var(--gray-500);
      max-width: 400px;
      line-height: 1.65;
      margin-bottom: 28px;
    }

    .btn-moodle {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.9375rem;
      background: #F27F22;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px 28px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.2s;
      margin-bottom: 10px;
    }

    .btn-moodle:hover { opacity: 0.88; }

    .no-account {
      font-family: 'Nunito', sans-serif;
      font-size: 0.78125rem;
      font-weight: 600;
      color: var(--gray-500);
    }
  </style>
</head>
<body>
  <section class="moodle-section">
    <img
      class="moodle-logo"
      src="https://assets.zyrosite.com/tPWPZ3kEpjHdFO9F/moodle-1-740x380-s84vr5GqRxP3NUXr.png"
      alt="Moodle"
    >
    <h2>Try before you buy.</h2>
    <p class="desc">Access a full demo course — no account, no commitment.</p>
    <a
      class="btn-moodle"
      href="https://elearning.fdsinstitut.com"
      target="_blank"
      rel="noopener"
    >Preview Platform &rarr;</a>
    <span class="no-account">No account needed</span>
  </section>
</body>
</html>
