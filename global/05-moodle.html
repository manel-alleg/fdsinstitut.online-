<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDS Institut — Platform Preview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&family=Montserrat:wght@700;900&family=JetBrains+Mono:wght@400&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{background:#030712;color:#fff;font-family:'Poppins',sans-serif}
h2{font-family:'Montserrat',sans-serif;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
:root{--orange:#f97316;--ink:#15233c}
::selection{background:var(--orange);color:var(--ink)}
.label-mono{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase}

section{padding:3.5rem 1.5rem 4rem}
@media(min-width:1024px){section{padding:4rem 3rem}}

.card{
  max-width:72rem;margin:0 auto;
  position:relative;border-radius:2rem;overflow:hidden;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.03);
  backdrop-filter:blur(24px);
}
.card-glow{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to left,rgba(249,115,22,.1),transparent);
}
.card-inner{
  position:relative;display:flex;flex-direction:column;
  align-items:center;gap:2rem;padding:2rem 2.5rem;
}
@media(min-width:1024px){
  .card-inner{flex-direction:row;padding:3rem}
}

.icon-block{
  flex-shrink:0;width:80px;height:80px;border-radius:1rem;
  background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.3);
  display:flex;align-items:center;justify-content:center;font-size:2.5rem;
}

.text-block{flex:1;text-align:center}
@media(min-width:1024px){.text-block{text-align:left}}
.eyebrow{color:var(--orange);margin-bottom:.5rem}
h2{font-size:clamp(1.5rem,4vw,2.25rem);font-weight:900;line-height:1.1;color:#fff}
.desc{margin-top:.75rem;color:rgba(255,255,255,.55);line-height:1.7;max-width:36rem}
@media(min-width:640px){.desc{font-size:1rem}}

.cta-block{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:.75rem}
.cta-btn{
  display:inline-flex;align-items:center;gap:.75rem;
  border-radius:9999px;background:var(--orange);color:var(--ink);
  font-family:'Montserrat',sans-serif;font-weight:900;
  padding:1rem 2rem;font-size:.9375rem;
  box-shadow:0 25px 70px -20px rgba(249,115,22,.55);
  transition:transform .3s;
}
.cta-btn:hover{transform:scale(1.05)}
.no-account{color:rgba(255,255,255,.3)}
</style>
</head>
<body>
<section>
  <div class="card">
    <div class="card-glow"></div>
    <div class="card-inner">
      <div class="icon-block">🎓</div>
      <div class="text-block">
        <p class="label-mono eyebrow">— Free preview</p>
        <h2>Try before you buy.</h2>
        <p class="desc">Access a full demo course in Visitor Mode — no account, no commitment. See exactly what you're getting before you enroll.</p>
      </div>
      <div class="cta-block">
        <a href="https://moodle.fdsinstitut.online" target="_blank" rel="noopener noreferrer" class="cta-btn">
          Preview Platform →
        </a>
        <span class="label-mono no-account">No account needed</span>
      </div>
    </div>
  </div>
</section>
</body>
</html>
