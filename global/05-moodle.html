<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDS Institut — Moodle Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #FF7900;
  --orange-2: #FF9100;
  --blue: #00304E;
  --black: #111;
  --gray-50: #F7F8FA;
  --gray-100: #F0F1F3;
  --gray-200: #E2E3E5;
  --gray-500: #6B7280;
  --moodle: #F27F22;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body { background: #fff; color: var(--black); font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
h2 { font-family: 'Sora', sans-serif; letter-spacing: -.025em; }
button { cursor: pointer; font-family: inherit; border: none; background: none; }
img { max-width: 100%; display: block; }

@keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

.reveal { opacity: 0; transform: translateY(28px); transition: opacity .65s ease, transform .65s ease; }
.reveal.in { opacity: 1; transform: none; }
.reveal-d1.in { transition-delay: .1s; }
.reveal-d2.in { transition-delay: .2s; }
.reveal-d3.in { transition-delay: .3s; }
.reveal-d4.in { transition-delay: .4s; }

.btn { display: inline-flex; align-items: center; gap: .5rem; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: .9rem; border-radius: 10px; padding: .75rem 1.5rem; transition: all .2s ease; cursor: pointer; border: none; white-space: nowrap; }
.btn-moodle { background: var(--moodle); color: #fff; padding: 1rem 2.25rem; font-size: 1rem; }
.btn-moodle:hover { background: #d96e15; transform: translateY(-1px); }
.btn-lg { padding: 1rem 2rem; font-size: 1rem; border-radius: 12px; }

.green-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
  display: inline-block;
  animation: pulseDot 1.4s ease infinite;
}

/* ─── MOODLE SECTION ─── */
.moodle-section {
  background: linear-gradient(135deg, #FFF8F4 0%, #FFF3E8 40%, #F7F8FA 100%);
  padding: 6rem 1.5rem;
}
.moodle-inner {
  max-width: 80rem;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5rem;
  align-items: center;
}
.moodle-logo-box {
  display: inline-block;
  background: #fff;
  border: 1.5px solid var(--gray-200);
  border-radius: 16px;
  padding: .75rem 1.5rem;
  margin-bottom: 1.75rem;
  box-shadow: 0 4px 16px rgba(0,0,0,.06);
}
.moodle-h2 {
  font-size: clamp(1.5rem, 3vw, 2rem);
  font-weight: 800;
  color: var(--black);
  margin-bottom: .75rem;
  line-height: 1.2;
}
.moodle-sub {
  font-size: .95rem;
  color: var(--gray-500);
  line-height: 1.65;
}
.moodle-checks { display: flex; flex-direction: column; gap: .75rem; margin: 1.5rem 0 2rem; }
.moodle-check {
  display: flex;
  align-items: center;
  gap: .6rem;
  font-family: 'Montserrat', sans-serif;
  font-weight: 600;
  font-size: .9rem;
  color: var(--black);
}
.moodle-check svg { color: #22c55e; flex-shrink: 0; }
.moodle-stats {
  display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1.75rem;
  padding: 1rem 1.25rem;
  background: rgba(255,121,0,.06);
  border-radius: 12px; border: 1px solid rgba(255,121,0,.15);
}
.moodle-stat { display: flex; flex-direction: column; }
.moodle-stat-num {
  font-family: 'Sora', sans-serif; font-weight: 800; font-size: 1.375rem;
  color: var(--orange); line-height: 1;
}
.moodle-stat-lbl {
  font-family: 'Nunito', sans-serif; font-weight: 700; font-size: .7rem;
  letter-spacing: .06em; text-transform: uppercase; color: var(--gray-500);
  margin-top: .2rem;
}
.moodle-card-wrap {
  position: relative;
  border-radius: 20px;
  overflow: visible;
  height: 400px;
}
.moodle-card-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 20px;
}
.moodle-live-badge {
  position: absolute;
  bottom: 1.25rem;
  left: 1.25rem;
  background: #fff;
  border-radius: 12px;
  padding: .6rem 1rem;
  display: flex;
  align-items: center;
  gap: .5rem;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: .75rem;
  color: var(--black);
  box-shadow: 0 8px 24px -4px rgba(0,0,0,.18);
}
.moodle-ring {
  position: absolute; bottom: -24px; right: -24px;
  width: 120px; height: 120px; border-radius: 50%;
  border: 3px solid var(--orange); opacity: .25; pointer-events: none;
}

@media (max-width: 1023px) {
  .moodle-inner { grid-template-columns: 1fr; gap: 3rem; }
}
</style>
</head>
<body>

<!-- ═══ 7. MOODLE PREVIEW ═══ -->
<section class="moodle-section" aria-labelledby="moodle-heading">
  <div class="moodle-inner">
    <div class="moodle-text">
      <div class="moodle-logo reveal">
        <div class="moodle-logo-box">
          <img src="https://assets.zyrosite.com/tPWPZ3kEpjHdFO9F/moodle-1-740x380-s84vr5GqRxP3NUXr.png" alt="Moodle LMS" style="height:80px;width:auto;display:block;">
        </div>
      </div>
      <h2 class="moodle-h2 reveal reveal-d1" id="moodle-heading">Your classroom, accessible 24/7.</h2>
      <p class="moodle-sub reveal reveal-d2">All your live sessions, replays, exercises, and certificates — in one place, powered by Moodle.</p>
      <div class="moodle-checks reveal reveal-d3">
        <div class="moodle-check">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
          HD live sessions via Zoom
        </div>
        <div class="moodle-check">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
          Lifetime replay access
        </div>
        <div class="moodle-check">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
          Certificate on completion
        </div>
      </div>
      <div class="moodle-stats reveal reveal-d4">
        <div class="moodle-stat">
          <span class="moodle-stat-num">2 400+</span>
          <span class="moodle-stat-lbl">Enrolled students</span>
        </div>
        <div class="moodle-stat">
          <span class="moodle-stat-num">40+</span>
          <span class="moodle-stat-lbl">Live courses</span>
        </div>
        <div class="moodle-stat">
          <span class="moodle-stat-num">98%</span>
          <span class="moodle-stat-lbl">Satisfaction</span>
        </div>
      </div>
      <button class="btn btn-moodle btn-lg reveal reveal-d4" onclick="window.open('https://elearning.fdsinstitut.com','_blank')" aria-label="Open the Moodle learning platform in a new tab">
        Open the platform &nbsp;→
      </button>
    </div>
    <div class="moodle-card-side reveal reveal-d2">
      <div class="moodle-card-wrap">
        <img src="https://images.pexels.com/photos/5905902/pexels-photo-5905902.jpeg?auto=compress&cs=tinysrgb&w=900" alt="Student attending a live German class online" loading="lazy">
        <div class="moodle-live-badge">
          <span class="green-dot" aria-hidden="true"></span>
          Live now &nbsp;·&nbsp; 24 students online
        </div>
        <div class="moodle-ring"></div>
      </div>
    </div>
  </div>
</section>

<script>
const revealObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('in');
      revealObs.unobserve(e.target);
    }
  });
}, { threshold: 0.12 });
document.querySelectorAll('.reveal').forEach(el => revealObs.observe(el));
</script>
</body>
</html>
