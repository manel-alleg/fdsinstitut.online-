<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDS Institut — Nav (Global)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=JetBrains+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{background:#030712;color:#fff;font-family:'Montserrat',sans-serif}
a{color:inherit;text-decoration:none}
:root{--orange:#f97316;--ink:#15233c}
::selection{background:var(--orange);color:var(--ink)}
.label-mono{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase}

nav{position:relative;z-index:30;border-bottom:1px solid rgba(255,255,255,.05)}
.nav-inner{
  max-width:80rem;margin:0 auto;
  padding:1rem 1.5rem;
  display:flex;align-items:center;justify-content:space-between;
}
@media(min-width:1024px){.nav-inner{padding:1rem 3rem}}

.logo{font-weight:900;font-size:1.25rem;letter-spacing:-.04em;color:#fff}
.logo .dot{color:var(--orange)}
.logo .inst{
  color:rgba(255,255,255,.3);
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.18em;margin-left:.5rem;display:none;
}
@media(min-width:640px){.logo .inst{display:inline}}

.nav-right{display:flex;align-items:center;gap:.75rem}
.badge-text{color:rgba(255,255,255,.4);display:none}
@media(min-width:768px){.badge-text{display:inline}}

.switcher{
  border-radius:9999px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.05);
  padding:.375rem .75rem;
  font-size:.75rem;
  font-weight:700;
  color:rgba(255,255,255,.8);
  transition:border-color .2s,color .2s;
  cursor:pointer;
  font-family:'Montserrat',sans-serif;
}
.switcher:hover{border-color:var(--orange);color:var(--orange)}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/" class="logo">FDS<span class="dot">.</span><span class="inst">INSTITUT</span></a>
    <div class="nav-right">
      <span class="badge-text label-mono">Online · A1 → C2 · Worldwide</span>
      <a href="../dz/index.html" class="switcher">🇩🇿 Algérie</a>
    </div>
  </div>
</nav>
</body>
</html>
