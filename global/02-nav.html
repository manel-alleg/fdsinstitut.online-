<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDS Institut — Navigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #FF7900;
  --orange-2: #FF9100;
  --blue: #00304E;
  --black: #111;
  --gray-50: #F7F8FA;
  --gray-100: #F0F1F3;
  --gray-200: #E2E3E5;
  --gray-500: #6B7280;
  --moodle: #F27F22;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body { background: #fff; color: var(--black); font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button { cursor: pointer; font-family: inherit; border: none; background: none; }

.btn { display: inline-flex; align-items: center; gap: .5rem; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: .9rem; border-radius: 10px; padding: .75rem 1.5rem; transition: all .2s ease; cursor: pointer; border: none; white-space: nowrap; }
.btn-orange { background: var(--orange); color: #fff; }
.btn-orange:hover { background: var(--orange-2); transform: translateY(-1px); box-shadow: 0 8px 20px -4px rgba(255,121,0,.4); }

.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #fff;
  border-bottom: 1px solid var(--gray-200);
  height: 64px;
  display: flex;
  align-items: center;
}
.nav-inner {
  width: 100%;
  max-width: 80rem;
  margin: 0 auto;
  padding: 0 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}
.nav-brand {
  display: flex;
  align-items: center;
  gap: .75rem;
}
.nav-logo {
  font-family: 'Sora', sans-serif;
  font-weight: 800;
  font-size: 1.45rem;
  color: var(--blue);
  letter-spacing: -.04em;
  line-height: 1;
}
.nav-logo span { color: var(--orange); }
.nav-badge {
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: .65rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  background: var(--gray-100);
  color: var(--blue);
  padding: .25rem .6rem;
  border-radius: 999px;
}
.nav-actions {
  display: flex;
  align-items: center;
  gap: .75rem;
}
.nav-link-dz {
  font-family: 'Montserrat', sans-serif;
  font-weight: 600;
  font-size: .85rem;
  color: var(--blue);
  border: 1.5px solid var(--gray-200);
  padding: .45rem .9rem;
  border-radius: 8px;
  transition: border-color .2s;
  display: flex;
  align-items: center;
  gap: .35rem;
}
.nav-link-dz:hover { border-color: var(--blue); }

@media (max-width: 600px) {
  .nav-badge { display: none; }
  .nav-link-dz { display: none; }
}
</style>
</head>
<body>

<!-- ═══ 2. STICKY NAV ═══ -->
<nav class="nav" role="navigation" aria-label="Main navigation">
  <div class="nav-inner">
    <div class="nav-brand">
      <div class="nav-logo">FDS<span>.</span></div>
      <div class="nav-badge">Global &nbsp;·&nbsp; A1–C2</div>
    </div>
    <div class="nav-actions">
      <a href="../dz/index.html" class="nav-link-dz" aria-label="Visit Algeria campus">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        Algeria
      </a>
      <button class="btn btn-orange" onclick="scrollToHero()" aria-label="Reserve your seat — scroll to enrollment form">Reserve my seat</button>
    </div>
  </div>
</nav>

<script>
function scrollToHero() {
  const hero = document.getElementById('hero');
  if (hero) {
    hero.scrollIntoView({ behavior: 'smooth' });
  } else {
    window.location.href = '#hero';
  }
}
</script>
</body>
</html>
