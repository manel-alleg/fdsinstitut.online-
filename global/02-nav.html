<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FDS Institut — Nav</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Montserrat:wght@400;500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }

    :root {
      --orange: #FF7900;
      --blue: #00304E;
      --gray-50: #F7F8FA;
      --gray-200: #E2E3E5;
      --gray-500: #6B7280;
      --black: #111;
    }

    body {
      background: #fff;
      font-family: 'Montserrat', sans-serif;
      color: var(--black);
    }

    a { color: inherit; text-decoration: none; }

    nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #fff;
      border-bottom: 1px solid var(--gray-200);
    }

    .nav-inner {
      max-width: 80rem;
      margin: 0 auto;
      padding: 0 1.5rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    @media (min-width: 1024px) {
      .nav-inner { padding: 0 3rem; }
    }

    .logo {
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: 1.375rem;
      color: var(--black);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
    }

    .logo .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: var(--orange);
      border-radius: 9999px;
      margin-left: 2px;
      margin-bottom: 2px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-badge {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      color: var(--gray-500);
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: 9999px;
      padding: 4px 12px;
      letter-spacing: 0.01em;
      display: none;
    }

    @media (min-width: 640px) {
      .nav-badge { display: inline-flex; align-items: center; }
    }

    .switcher {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.8125rem;
      color: var(--black);
      border: 1.5px solid var(--gray-200);
      border-radius: 9999px;
      padding: 6px 16px;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .switcher:hover {
      border-color: var(--orange);
      color: var(--orange);
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/" class="logo">
        FDS<span class="dot"></span>
      </a>
      <div class="nav-right">
        <span class="nav-badge">Online &middot; A1–C2 &middot; Worldwide</span>
        <a href="../dz/index.html" class="switcher">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          DZ / Algérie
        </a>
      </div>
    </div>
  </nav>
</body>
</html>
