<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDS Institut — Urgency Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #FF7900;
  --orange-2: #FF9100;
  --blue: #00304E;
  --black: #111;
  --gray-50: #F7F8FA;
  --gray-100: #F0F1F3;
  --gray-200: #E2E3E5;
  --gray-500: #6B7280;
  --moodle: #F27F22;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }
body { background: var(--orange); font-family: 'Montserrat', sans-serif; overflow-x: hidden; }

@keyframes pulseDot {
  0%,100% { opacity: 1; }
  50% { opacity: .35; }
}

.urgency-bar {
  background: var(--orange);
  color: #fff;
  text-align: center;
  padding: .6rem 1.5rem;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: .82rem;
  letter-spacing: .03em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .6rem;
  min-height: 38px;
}

.pulse-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #fff;
  display: inline-block;
  flex-shrink: 0;
  animation: pulseDot 1.4s ease infinite;
}
</style>
</head>
<body>

<div class="urgency-bar" role="banner" aria-label="Enrollment notice">
  <span class="pulse-dot" aria-hidden="true"></span>
  New cohort starting Monday &nbsp;&middot;&nbsp; Limited spots &nbsp;&middot;&nbsp; Enroll in 2 minutes
</div>

</body>
</html>
