<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FDS Institut — Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Montserrat:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }

    :root {
      --orange: #FF7900;
      --blue: #00304E;
      --gray-50: #F7F8FA;
      --gray-200: #E2E3E5;
      --gray-500: #6B7280;
      --black: #111;
    }

    body {
      background: #fff;
      font-family: 'Montserrat', sans-serif;
      color: var(--black);
    }

    .hero {
      padding: 5rem 1.5rem 5.5rem;
      text-align: center;
    }

    @media (min-width: 1024px) {
      .hero { padding: 6rem 3rem 7rem; }
    }

    .hero-inner {
      max-width: 52rem;
      margin: 0 auto;
    }

    .eyebrow-chip {
      display: inline-flex;
      align-items: center;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.8125rem;
      color: var(--blue);
      background: var(--gray-50);
      border: 1.5px solid var(--gray-200);
      border-radius: 9999px;
      padding: 5px 14px;
      letter-spacing: 0.01em;
      margin-bottom: 1.75rem;
    }

    h1 {
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: var(--black);
      margin-bottom: 1.25rem;
    }

    h1 .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: var(--orange);
      border-radius: 9999px;
      margin-left: 3px;
      vertical-align: middle;
      position: relative;
      top: -6px;
    }

    .sub {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.0625rem;
      font-weight: 500;
      color: var(--gray-500);
      line-height: 1.7;
      max-width: 38rem;
      margin: 0 auto 2rem;
    }

    @media (min-width: 640px) {
      .sub { font-size: 1.125rem; }
    }

    .trust-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .pill {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.8125rem;
      border-radius: 9999px;
      padding: 5px 14px;
      border: 1.5px solid transparent;
      letter-spacing: 0.01em;
    }

    .pill-orange { background: var(--orange); color: #fff; border-color: var(--orange); }
    .pill-border { background: #fff; color: var(--black); border-color: var(--gray-200); }

    .star-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 2.5rem;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--black);
      flex-wrap: wrap;
    }

    .stars {
      display: flex;
      gap: 2px;
      color: var(--orange);
    }

    .star-count {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--gray-500);
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      padding: 1.75rem 0;
      border-top: 1px solid var(--gray-200);
      border-bottom: 1px solid var(--gray-200);
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
    }

    .stat-item { text-align: center; }

    .stat-n {
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: 1.625rem;
      color: var(--black);
      letter-spacing: -0.02em;
    }

    .stat-l {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      color: var(--gray-500);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .cta-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.9375rem;
      border-radius: 9999px;
      padding: 14px 28px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--orange);
      color: #fff;
      border-color: var(--orange);
    }

    .btn-outline {
      background: #fff;
      color: var(--black);
      border-color: var(--gray-200);
    }

    .btn-outline:hover {
      border-color: var(--orange);
      color: var(--orange);
      opacity: 1;
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-inner">

      <span class="eyebrow-chip">A1 &rarr; C2 &middot; Live Online</span>

      <h1>Speak German. Live it<span class="dot"></span></h1>

      <p class="sub">Live online classes with European standards. Pick your level, pick your time.</p>

      <div class="trust-pills">
        <span class="pill pill-orange">12,400+ students</span>
        <span class="pill pill-border">94% pass rate</span>
        <span class="pill pill-border">Asia &middot; MENA &middot; Europe</span>
      </div>

      <div class="star-row">
        <span class="stars">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </span>
        <span>4.9 / 5</span>
        <span class="star-count">1,200+ verified reviews</span>
      </div>

      <div class="stats">
        <div class="stat-item">
          <div class="stat-n">12k+</div>
          <div class="stat-l">Students</div>
        </div>
        <div class="stat-item">
          <div class="stat-n">94%</div>
          <div class="stat-l">Pass rate</div>
        </div>
        <div class="stat-item">
          <div class="stat-n">A1&rarr;C2</div>
          <div class="stat-l">All levels</div>
        </div>
      </div>

      <div class="cta-row">
        <button class="btn btn-primary" onclick="alert('Form modal goes here')">Reserve my seat</button>
        <button class="btn btn-outline">Preview platform</button>
      </div>

    </div>
  </section>
</body>
</html>
