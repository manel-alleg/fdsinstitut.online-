<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FDS Institut — What's Included</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Montserrat:wght@400;500&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }

    :root {
      --orange: #FF7900;
      --blue: #00304E;
      --gray-50: #F7F8FA;
      --gray-200: #E2E3E5;
      --gray-500: #6B7280;
      --black: #111;
    }

    body {
      background: #fff;
      font-family: 'Montserrat', sans-serif;
      color: var(--black);
    }

    .value-section {
      max-width: 80rem;
      margin: 0 auto;
      padding: 4rem 1.5rem 5rem;
    }

    @media (min-width: 1024px) {
      .value-section { padding: 5rem 3rem; }
    }

    .label {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 10px;
    }

    h2 {
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: clamp(1.625rem, 3vw, 2.25rem);
      color: var(--black);
      margin-bottom: 3rem;
      max-width: 32rem;
    }

    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: 1fr;
    }

    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 1024px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    .card {
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: 20px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    .card:hover {
      border-color: var(--orange);
      box-shadow: 0 4px 20px rgba(255,121,0,0.08);
      transform: translateY(-2px);
    }

    .icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #fff5ec;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--orange);
      flex-shrink: 0;
    }

    .card-title {
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: var(--black);
    }

    .card-desc {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.875rem;
      color: var(--gray-500);
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <section class="value-section">
    <p class="label">What&rsquo;s included</p>
    <h2>Everything you need to succeed.</h2>

    <div class="grid">

      <div class="card">
        <div class="icon-wrap">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <p class="card-title">Free placement test</p>
        <p class="card-desc">Know exactly where you stand.</p>
      </div>

      <div class="card">
        <div class="icon-wrap">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
          </svg>
        </div>
        <p class="card-title">Lifetime replays</p>
        <p class="card-desc">Missed a class? No worries.</p>
      </div>

      <div class="card">
        <div class="icon-wrap">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <polyline points="16 11 18 13 22 9"/>
          </svg>
        </div>
        <p class="card-title">Certified teachers</p>
        <p class="card-desc">Min. 5 years teaching experience.</p>
      </div>

      <div class="card">
        <div class="icon-wrap">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <p class="card-title">WhatsApp support</p>
        <p class="card-desc">Fast replies, 7 days a week.</p>
      </div>

    </div>
  </section>
</body>
</html>
