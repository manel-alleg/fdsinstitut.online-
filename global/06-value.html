<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDS Institut — What's Included</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&family=Montserrat:wght@700;900&family=JetBrains+Mono:wght@400&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{background:#030712;color:#fff;font-family:'Poppins',sans-serif}
h2,h3{font-family:'Montserrat',sans-serif;letter-spacing:-.02em}
:root{--orange:#f97316;--ink:#15233c}
::selection{background:var(--orange);color:var(--ink)}
.label-mono{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase}

section{position:relative;max-width:80rem;margin:0 auto;padding:4rem 1.5rem 5rem}
@media(min-width:1024px){section{padding:5rem 3rem}}

.eyebrow{color:var(--orange);margin-bottom:1rem}
h2{
  font-size:clamp(1.875rem,5vw,3rem);font-weight:900;line-height:.95;
  color:#fff;max-width:32rem;margin-bottom:3rem;
}

.grid{display:grid;gap:1rem;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr)}}

.card{
  group:1;border-radius:1.25rem;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);
  padding:1.5rem;
  transition:transform .3s,border-color .3s,background .3s;
}
.card:hover{transform:translateY(-4px);border-color:rgba(249,115,22,.5);background:rgba(255,255,255,.06)}
.card-num{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--orange);margin-bottom:.75rem}
.card-title{font-family:'Montserrat',sans-serif;font-weight:900;font-size:1.125rem;color:#fff;margin-bottom:.375rem}
.card-desc{font-size:.875rem;color:rgba(255,255,255,.5)}
.card-line{
  margin-top:1rem;height:1px;width:2rem;
  background:rgba(255,255,255,.15);
  transition:width .5s ease,background .5s ease;
}
.card:hover .card-line{width:100%;background:var(--orange)}
</style>
</head>
<body>
<section>
  <p class="label-mono eyebrow">— What's included</p>
  <h2>Everything to actually succeed.</h2>
  <div class="grid">
    <div class="card">
      <div class="card-num">01</div>
      <div class="card-title">Free placement test</div>
      <div class="card-desc">Know exactly where you stand.</div>
      <div class="card-line"></div>
    </div>
    <div class="card">
      <div class="card-num">02</div>
      <div class="card-title">Lifetime replays</div>
      <div class="card-desc">Missed a class? No worries.</div>
      <div class="card-line"></div>
    </div>
    <div class="card">
      <div class="card-num">03</div>
      <div class="card-title">Native certified teachers</div>
      <div class="card-desc">Min. 5 years teaching.</div>
      <div class="card-line"></div>
    </div>
    <div class="card">
      <div class="card-num">04</div>
      <div class="card-title">WhatsApp support</div>
      <div class="card-desc">Fast answers, 7 days a week.</div>
      <div class="card-line"></div>
    </div>
  </div>
</section>
</body>
</html>
