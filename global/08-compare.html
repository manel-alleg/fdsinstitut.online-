<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparison — FDS Institut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Montserrat:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --orange: #FF7900;
    --blue: #00304E;
    --gray-50: #F7F8FA;
    --gray-200: #E2E3E5;
    --gray-500: #6B7280;
    --black: #111111;
  }
  body { font-family: 'Montserrat', sans-serif; background: #fff; color: var(--black); }
  section { max-width: 56rem; margin: 0 auto; padding: 5rem 1.5rem; }
  .eyebrow {
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.6875rem;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--orange); margin-bottom: 0.75rem;
  }
  h2 {
    font-family: 'Sora', sans-serif; font-weight: 800;
    font-size: clamp(1.75rem, 4vw, 2.5rem); letter-spacing: -0.03em; line-height: 1.1;
    color: var(--black); margin-bottom: 2.5rem;
  }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table {
    width: 100%; border-collapse: collapse;
    border: 1.5px solid var(--gray-200); border-radius: 16px; overflow: hidden;
  }
  thead th { padding: 1rem 1.25rem; text-align: left; background: var(--gray-50); border-bottom: 1.5px solid var(--gray-200); }
  thead th:first-child {
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.6875rem;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--gray-500);
  }
  .fds-badge {
    display: inline-flex; align-items: center; background: var(--orange); color: #fff;
    border-radius: 999px; padding: 0.3rem 0.8rem;
    font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.75rem;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .col-trad { font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 0.9rem; color: var(--gray-500); }
  tbody tr:nth-child(even) { background: var(--gray-50); }
  tbody td { padding: 1rem 1.25rem; border-bottom: 1px solid var(--gray-200); color: var(--gray-500); font-size: 0.9rem; }
  tbody tr:last-child td { border-bottom: none; }
  tbody td:first-child { font-weight: 600; color: var(--black); }
  .cell-fds { color: var(--black) !important; font-weight: 500 !important; }
  .icon-orange { color: var(--orange); display: inline-flex; vertical-align: middle; }
  .icon-gray { color: var(--gray-500); display: inline-flex; vertical-align: middle; }
  .icon-red { color: #DC2626; display: inline-flex; vertical-align: middle; }
</style>
</head>
<body>
  <section>
    <p class="eyebrow">Why FDS</p>
    <h2>FDS vs the alternatives.</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Feature</th>
            <th><span class="fds-badge">FDS Institut</span></th>
            <th class="col-trad">Traditional Institute</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Live instruction</td>
            <td class="cell-fds"><span class="icon-orange"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span></td>
            <td><span class="icon-gray"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span></td>
          </tr>
          <tr>
            <td>Price (monthly)</td>
            <td class="cell-fds">From €85</td>
            <td>€400–600+</td>
          </tr>
          <tr>
            <td>Class size</td>
            <td class="cell-fds">Max 8 students</td>
            <td>15–25 students</td>
          </tr>
          <tr>
            <td>Replay access</td>
            <td class="cell-fds">Lifetime</td>
            <td><span class="icon-red"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>&nbsp;Not included</td>
          </tr>
          <tr>
            <td>Local payment</td>
            <td class="cell-fds">Card, transfer</td>
            <td>Card only</td>
          </tr>
          <tr>
            <td>Trial class</td>
            <td class="cell-fds">Free</td>
            <td>Rarely offered</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</body>
</html>
