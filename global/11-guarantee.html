<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDS Institut — Money-Back Guarantee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #FF7900;
  --orange-2: #FF9100;
  --blue: #00304E;
  --black: #111;
  --gray-50: #F7F8FA;
  --gray-200: #E2E3E5;
  --gray-500: #6B7280;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }
body { background: var(--orange); color: #fff; font-family: 'Montserrat', sans-serif; }
h1,h2,h3,h4 { font-family: 'Sora', sans-serif; letter-spacing: -.025em; }

.guarantee-section {
  background: var(--orange);
  padding: 4rem 1.5rem;
}
.guarantee-inner {
  max-width: 80rem;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 2.5rem;
}
.guarantee-icon { flex-shrink: 0; }
.guarantee-text { flex: 1; }

.guarantee-title {
  font-family: 'Sora', sans-serif;
  font-weight: 800;
  font-size: clamp(1.25rem, 2.5vw, 1.75rem);
  color: #fff;
  margin-bottom: .4rem;
  line-height: 1.15;
}
.guarantee-sub {
  font-size: .95rem;
  color: rgba(255,255,255,.85);
  line-height: 1.5;
}
.guarantee-action { flex-shrink: 0; }

.btn-white-orange {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  background: #fff;
  color: var(--orange);
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  border-radius: 12px;
  padding: 1rem 2rem;
  border: none;
  cursor: pointer;
  transition: background .2s ease, transform .2s ease;
  white-space: nowrap;
}
.btn-white-orange:hover {
  background: var(--gray-50);
  transform: translateY(-2px);
}

@media (max-width: 768px) {
  .guarantee-inner {
    flex-direction: column;
    text-align: center;
    gap: 2rem;
  }
  .guarantee-action { width: 100%; }
  .btn-white-orange { width: 100%; justify-content: center; }
}
</style>
</head>
<body>

<section class="guarantee-section" aria-labelledby="guarantee-heading">
  <div class="guarantee-inner">

    <div class="guarantee-icon" aria-hidden="true">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <polyline points="9 12 11 14 15 10"/>
      </svg>
    </div>

    <div class="guarantee-text">
      <h2 class="guarantee-title" id="guarantee-heading">14-day money-back guarantee.</h2>
      <p class="guarantee-sub">Try a class risk-free. Full refund if you&#8217;re not satisfied &#8212; no questions asked.</p>
    </div>

    <div class="guarantee-action">
      <button class="btn-white-orange" onclick="window.parent && window.parent.scrollToHero ? window.parent.scrollToHero() : window.scrollTo({top:0})" aria-label="Start your risk-free trial">
        Start risk-free &nbsp;&#x2192;
      </button>
    </div>

  </div>
</section>

</body>
</html>
