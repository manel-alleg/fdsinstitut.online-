<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FDS Institut — Guarantee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }

    :root {
      --orange: #FF7900;
      --orange-2: #FF9100;
      --blue: #00304E;
      --gray-50: #F7F8FA;
      --gray-200: #E2E3E5;
      --gray-500: #6B7280;
      --black: #111;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      color: var(--black);
    }

    .guarantee-section {
      background: linear-gradient(135deg, #FF7900 0%, #FF9100 100%);
      padding: 4rem 1.5rem;
    }

    .guarantee-inner {
      max-width: 80rem;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 2.5rem;
    }

    .guarantee-icon {
      flex-shrink: 0;
    }

    .guarantee-text {
      flex: 1;
    }

    .guarantee-title {
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: clamp(1.25rem, 2.5vw, 1.75rem);
      color: #fff;
      margin-bottom: .4rem;
      line-height: 1.15;
      letter-spacing: -.025em;
    }

    .guarantee-sub {
      font-size: .95rem;
      color: rgba(255,255,255,.85);
      line-height: 1.5;
      font-weight: 500;
    }

    .guarantee-action {
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 12px;
      padding: 1rem 2rem;
      cursor: pointer;
      border: none;
      white-space: nowrap;
      transition: all .2s ease;
    }

    .btn-white-orange {
      background: #fff;
      color: var(--orange);
    }

    .btn-white-orange:hover {
      background: var(--gray-50);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px -4px rgba(0,0,0,.15);
    }

    @media (max-width: 1023px) {
      .guarantee-inner {
        flex-direction: column;
        text-align: center;
        gap: 2rem;
      }
    }

    @media (max-width: 600px) {
      .guarantee-section { padding: 3rem 1rem; }
    }
  </style>
</head>
<body>

<section class="guarantee-section" aria-labelledby="guarantee-heading">
  <div class="guarantee-inner">

    <div class="guarantee-icon" aria-hidden="true">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <polyline points="9 12 11 14 15 10"/>
      </svg>
    </div>

    <div class="guarantee-text">
      <h2 class="guarantee-title" id="guarantee-heading">14-day money-back guarantee.</h2>
      <p class="guarantee-sub">Try a class risk-free. Full refund if you're not satisfied — no questions asked.</p>
    </div>

    <div class="guarantee-action">
      <button class="btn btn-white-orange" onclick="openModal()" aria-label="Start your risk-free trial">
        Start risk-free &nbsp;&rarr;
      </button>
    </div>

  </div>
</section>

<script>
function openModal() {
  if (window.parent && window.parent.openModal) {
    window.parent.openModal();
  } else if (document.getElementById('hero')) {
    document.getElementById('hero').scrollIntoView({ behavior: 'smooth' });
  }
}

function scrollToHero() {
  if (window.parent && window.parent.openModal) {
    window.parent.openModal();
  } else if (document.getElementById('hero')) {
    document.getElementById('hero').scrollIntoView({ behavior: 'smooth' });
  }
}
</script>

</body>
</html>
