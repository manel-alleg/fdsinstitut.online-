<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FDS Institut — Final CTA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }

    :root {
      --orange: #FF7900;
      --orange-2: #FF9100;
      --blue: #00304E;
      --gray-50: #F7F8FA;
      --gray-200: #E2E3E5;
      --gray-500: #6B7280;
      --black: #111;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      color: var(--black);
    }

    .final-cta-section {
      background: var(--blue);
      padding: 7rem 1.5rem;
      text-align: center;
    }

    .final-cta-inner {
      max-width: 44rem;
      margin: 0 auto;
    }

    .final-cta-h2 {
      font-family: 'Sora', sans-serif;
      font-size: clamp(2rem, 5vw, 3.25rem);
      font-weight: 800;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 1rem;
      letter-spacing: -.03em;
    }

    .accent {
      color: var(--orange);
    }

    .final-cta-sub {
      font-size: 1rem;
      color: rgba(255,255,255,.7);
      line-height: 1.6;
      margin-bottom: 2.5rem;
      font-weight: 500;
    }

    .final-cta-btns {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 12px;
      padding: 1rem 2rem;
      cursor: pointer;
      border: none;
      white-space: nowrap;
      transition: all .2s ease;
      text-decoration: none;
    }

    .btn-orange {
      background: var(--orange);
      color: #fff;
    }

    .btn-orange:hover {
      background: var(--orange-2);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px -4px rgba(255,121,0,.4);
    }

    .btn-outline-white {
      background: transparent;
      color: #fff;
      border: 2px solid rgba(255,255,255,.6);
    }

    .btn-outline-white:hover {
      background: rgba(255,255,255,.1);
      border-color: #fff;
    }

    @media (max-width: 600px) {
      .final-cta-section { padding: 5rem 1rem; }
      .final-cta-btns { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>

<section class="final-cta-section" aria-labelledby="final-cta-heading">
  <div class="final-cta-inner">
    <h2 class="final-cta-h2" id="final-cta-heading">
      Ready to speak<br><span class="accent">German</span>?
    </h2>
    <p class="final-cta-sub">Join 12,000+ students. Live classes. Real teachers. Proven results.</p>
    <div class="final-cta-btns">
      <button class="btn btn-orange" onclick="openModal()" aria-label="Reserve my seat — scroll to enrollment form">
        Reserve my seat
      </button>
      <a class="btn btn-outline-white" href="https://elearning.fdsinstitut.com" target="_blank" rel="noopener" aria-label="Visit the learning platform">
        Visit the platform &nbsp;&rarr;
      </a>
    </div>
  </div>
</section>

<script>
function openModal() {
  if (window.parent && window.parent.openModal) {
    window.parent.openModal();
  } else if (document.getElementById('hero')) {
    document.getElementById('hero').scrollIntoView({ behavior: 'smooth' });
  }
}

function scrollToHero() {
  openModal();
}
</script>

</body>
</html>
