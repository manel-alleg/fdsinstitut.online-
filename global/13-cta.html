<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDS Institut — Ready to Speak German?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #FF7900;
  --orange-2: #FF9100;
  --blue: #00304E;
  --black: #111;
  --gray-50: #F7F8FA;
  --gray-200: #E2E3E5;
  --gray-500: #6B7280;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }
body { background: var(--blue); color: #fff; font-family: 'Montserrat', sans-serif; }
h1,h2,h3,h4 { font-family: 'Sora', sans-serif; letter-spacing: -.025em; }

.reveal { opacity: 0; transform: translateY(28px); transition: opacity .65s ease, transform .65s ease; }
.reveal.in { opacity: 1; transform: none; }
.reveal-d1.in { transition-delay: .1s; }
.reveal-d2.in { transition-delay: .2s; }

.cta-section {
  background: var(--blue);
  padding: 7rem 1.5rem;
  text-align: center;
}
.cta-inner { max-width: 44rem; margin: 0 auto; }

.cta-h2 {
  font-size: clamp(2rem, 5vw, 3.25rem);
  font-weight: 800;
  color: #fff;
  line-height: 1.1;
  margin-bottom: 1rem;
}
.accent { color: var(--orange); }

.cta-sub {
  font-size: 1rem;
  color: rgba(255,255,255,.7);
  line-height: 1.6;
  margin-bottom: 2.5rem;
}

.cta-btns {
  display: flex;
  gap: 1rem;
  justify-content: center;
  flex-wrap: wrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  border-radius: 12px;
  padding: 1rem 2rem;
  transition: all .2s ease;
  cursor: pointer;
  border: none;
  white-space: nowrap;
  text-decoration: none;
}
.btn-orange {
  background: var(--orange);
  color: #fff;
}
.btn-orange:hover {
  background: var(--orange-2);
  transform: translateY(-1px);
  box-shadow: 0 8px 20px -4px rgba(255,121,0,.4);
}
.btn-outline-white {
  background: transparent;
  color: #fff;
  border: 2px solid rgba(255,255,255,.5);
}
.btn-outline-white:hover {
  background: rgba(255,255,255,.1);
  border-color: #fff;
}

@media (max-width: 600px) {
  .cta-btns { flex-direction: column; align-items: center; }
  .btn { width: 100%; justify-content: center; }
}
</style>
</head>
<body>

<section class="cta-section" aria-labelledby="cta-heading">
  <div class="cta-inner">
    <h2 class="cta-h2 reveal" id="cta-heading">
      Ready to speak<br><span class="accent">German</span>?
    </h2>
    <p class="cta-sub reveal reveal-d1">
      Join 2&nbsp;400+ students learning German the right way &#8212; live, online, with real teachers.
    </p>
    <div class="cta-btns reveal reveal-d2">
      <button
        class="btn btn-orange"
        onclick="window.parent && window.parent.scrollToHero ? window.parent.scrollToHero() : window.scrollTo({top:0})"
        aria-label="Reserve my seat — scroll to enrollment form">
        Reserve my seat
      </button>
      <a
        class="btn btn-outline-white"
        href="https://elearning.fdsinstitut.com"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit the FDS learning platform (opens in new tab)">
        Visit the platform &nbsp;&#x2192;
      </a>
    </div>
  </div>
</section>

<script>
const revealObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); revealObs.unobserve(e.target); }
  });
}, { threshold: 0.12 });
document.querySelectorAll('.reveal').forEach(el => revealObs.observe(el));
</script>
</body>
</html>
