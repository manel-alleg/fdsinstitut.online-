<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Started — FDS Institut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Montserrat:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --orange: #FF7900;
    --blue: #00304E;
    --black: #111111;
  }
  body { font-family: 'Montserrat', sans-serif; background: var(--blue); }
  section {
    max-width: 48rem; margin: 0 auto; padding: 6rem 1.5rem; text-align: center;
  }
  h2 {
    font-family: 'Sora', sans-serif; font-weight: 800;
    font-size: clamp(2rem, 5vw, 3.25rem); letter-spacing: -0.03em; line-height: 1.1;
    color: #fff; margin-bottom: 1rem;
  }
  .sub { font-size: 1.0625rem; line-height: 1.65; color: rgba(255,255,255,0.8); margin-bottom: 2.5rem; }
  .btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  .btn-white {
    font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 0.9375rem;
    background: #fff; color: var(--blue); border: none; border-radius: 10px;
    padding: 0.9rem 1.75rem; cursor: pointer; text-decoration: none; transition: opacity 0.15s; display: inline-block;
  }
  .btn-white:hover { opacity: 0.9; }
  .btn-outline {
    font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 0.9375rem;
    background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,0.5);
    border-radius: 10px; padding: 0.9rem 1.75rem; cursor: pointer; text-decoration: none;
    transition: border-color 0.2s; display: inline-block;
  }
  .btn-outline:hover { border-color: #fff; }
</style>
</head>
<body>
  <section>
    <h2>Ready to speak German?</h2>
    <p class="sub">Join 12,000+ students learning German the right way — live, online, with real teachers.</p>
    <div class="btns">
      <button class="btn-white" onclick="openModal()">Reserve my seat</button>
      <a class="btn-outline" href="https://elearning.fdsinstitut.com" target="_blank" rel="noopener">Visit the platform &rarr;</a>
    </div>
  </section>
  <script>
    function openModal() {
      window.parent && window.parent.openModal ? window.parent.openModal() : alert('Modal coming soon.');
    }
  </script>
</body>
</html>
