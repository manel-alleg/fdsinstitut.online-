<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDS Institut — Ticker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #FF7900;
  --orange-2: #FF9100;
  --blue: #00304E;
  --black: #111;
  --gray-50: #F7F8FA;
  --gray-100: #F0F1F3;
  --gray-200: #E2E3E5;
  --gray-500: #6B7280;
  --moodle: #F27F22;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }
body { background: #fff; color: var(--black); font-family: 'Montserrat', sans-serif; overflow-x: hidden; }

@keyframes marquee { to { transform: translateX(-50%); } }

.ticker {
  background: #fff;
  border-top: 1px solid var(--gray-200);
  border-bottom: 1px solid var(--gray-200);
  overflow: hidden;
  padding: .85rem 0;
  white-space: nowrap;
}
.ticker-track {
  display: inline-flex;
  align-items: center;
  gap: 2rem;
  animation: marquee 34s linear infinite;
  will-change: transform;
}
.ticker-item {
  display: inline-flex;
  align-items: center;
  gap: 2rem;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: .82rem;
  letter-spacing: .04em;
  color: var(--black);
  white-space: nowrap;
}
.ticker-sep {
  flex-shrink: 0;
  color: var(--orange);
}
</style>
</head>
