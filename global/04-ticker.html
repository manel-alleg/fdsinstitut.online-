<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FDS Institut — Ticker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }

    :root {
      --orange: #FF7900;
      --gray-200: #E2E3E5;
      --black: #111;
    }

    body {
      background: #fff;
      overflow: hidden;
    }

    .ticker-wrap {
      border-top: 1px solid var(--gray-200);
      border-bottom: 1px solid var(--gray-200);
      background: #fff;
      padding: 13px 0;
      overflow: hidden;
    }

    .marquee {
      display: flex;
      width: max-content;
      animation: marquee 36s linear infinite;
      will-change: transform;
    }

    @keyframes marquee {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    .item {
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: 0.875rem;
      letter-spacing: 0.01em;
      white-space: nowrap;
      color: var(--black);
      display: flex;
      align-items: center;
    }

    .diamond {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--orange);
      transform: rotate(45deg);
      margin: 0 18px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="ticker-wrap">
    <div class="marquee" id="ticker"></div>
  </div>

  <script>
    const words = [
      'A1 → C2', 'Live online', 'Certified teachers', 'European standards',
      'Worldwide', 'Lifetime replays', 'Small cohorts', '14-day money-back'
    ];
    const all = [...words, ...words, ...words];
    const ticker = document.getElementById('ticker');
    const fullSet = [...all, ...all];
    fullSet.forEach(w => {
      const span = document.createElement('span');
      span.className = 'item';
      span.innerHTML = w + '<span class="diamond"></span>';
      ticker.appendChild(span);
    });
  </script>
</body>
</html>
