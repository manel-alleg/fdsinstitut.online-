<style>
:root {
  --orange: #FF7900;
  --orange-2: #FF9100;
  --blue: #00304E;
  --black: #111;
  --gray-50: #F7F8FA;
  --gray-100: #F0F1F3;
  --gray-200: #E2E3E5;
  --gray-500: #6B7280;
  --moodle: #F27F22;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }
body { background: #fff; font-family: 'Montserrat', sans-serif; overflow-x: hidden; }

@keyframes marquee {
  to { transform: translateX(-50%); }
}

.ticker {
  background: #fff;
  border-top: 1px solid var(--gray-200);
  border-bottom: 1px solid var(--gray-200);
  padding: .75rem 0;
  overflow: hidden;
  white-space: nowrap;
  user-select: none;
}

.ticker:hover .ticker-track {
  animation-play-state: paused;
}

.ticker-track {
  display: inline-flex;
  align-items: center;
  gap: 0;
  animation: marquee 38s linear infinite;
  will-change: transform;
}

.ticker-item {
  display: inline-flex;
  align-items: center;
  gap: .65rem;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: .82rem;
  letter-spacing: .04em;
  color: var(--black);
  padding: 0 1.5rem;
  white-space: nowrap;
}

.ticker-sep {
  display: inline-flex;
  align-items: center;
  color: var(--orange);
  flex-shrink: 0;
}
</style>
</head>
